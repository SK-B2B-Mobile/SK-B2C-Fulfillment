<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(r=>{
      console.log('SW registered');
      // ★ v89: 등록 직후 + 이후 2분마다 능동적으로 새 버전이 있는지 확인.
      //   브라우저가 자체적으로 SW 업데이트를 확인하는 주기가 느리거나 불규칙해서
      //   "새로고침해도 구버전 그대로"인 컴퓨터가 생기던 문제 — 직접 자주 체크하도록 보강.
      r.update().catch(()=>{});
      setInterval(()=>{r.update().catch(()=>{});},120000);
    }).catch(e=>console.log('SW error',e));
  });
  // ★ v61: 새 버전이 백그라운드에 설치되면(=다른 곳에서 업로드함) 화면에 조용한 배너로 알려줌.
  //   스캔 중간에 강제로 새로고침시키면 위험하므로 자동 새로고침은 하지 않고,
  //   작업자가 버튼을 눌러야만 새로고침되도록 함.
  let swRefreshed=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swRefreshed)return; // register() 최초 호출 시에도 한 번 발생하므로, 이미 배너 띄운 뒤엔 무시
    swRefreshed=true;
    if(!sessionStorage.getItem('sk_b2c_first_load_done')){
      sessionStorage.setItem('sk_b2c_first_load_done','1');
      return; // 최초 진입 시의 controllerchange는 무시
    }
    const b=document.createElement('div');
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#1C1B18;color:#F5E6C8;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:14px;font-family:sans-serif;font-size:13px;box-shadow:0 -2px 12px rgba(0,0,0,.3)';
    b.innerHTML='🔄 새 버전이 준비되었습니다. <button id="skb2cReloadBtn" style="background:#33301F;color:#F5E6C8;border:1px solid #F5E6C8;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:700">지금 새로고침</button>';
    document.body.appendChild(b);
    document.getElementById('skb2cReloadBtn').onclick=()=>location.reload();
  });
}
</script>

<!-- ★ v144: 텍스트 레이어가 없는(이미지로 인쇄된) 라벨 PDF를 위한 OCR 폴백. 실사례:
     53MB짜리 CBT 레이블 PDF(414p) 하나가 라벨 전체를 이미지로 인쇄해서 나와서, pdfjs
     getTextContent()가 전 페이지 빈 문자열을 반환 → 200건의 주문이 통째로 "라벨 페이지"로
     오인되어 스킵됨(603건 중 403건만 인식, 나머지 200건 소리소문없이 누락). 이 스크립트는
     그 200페이지 안의 실제 주문 데이터를 OCR로 다시 읽어내기 위해서만 씀 — 아래

     평소 텍스트 PDF에는 전혀 개입하지 않음(원칙 3: 좁은 조건의 안전장치). -->

const pruneStale=(list,fetchedList,scope,pendingIds)=>{
  const fetchedIds=new Set(fetchedList.map(r=>r.id).filter(Boolean));
  const nd=d=>{if(!d)return'';if(d instanceof Date){try{return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch(e){}}return String(d).slice(0,10);};

    if(scope!==''&&nd(l.date)!==scope)return true; // 조회 범위 밖 — 건드리지 않음
    if(fetchedIds.has(l.id))return true; // 서버에 여전히 존재
    if(pendingIds){const t=pendingIds.get(l.id);if(t&&(Date.now()-t)<30000)return true;} // 방금 로컬 작업 — 보호

  //   그 시간이 지나면 서버(다른 컴퓨터가 저장한 값 포함)를 신뢰하도록 변경.

    // ── 매칭 탐색 (id → pgNo+date 순서) ──
    let idx=-1;
    // 1) id로 찾기 (remote.id가 있고 로컬에 같은 id 있으면)
    if(remote.id){
      idx=merged.findIndex(l=>l.id&&l.id===remote.id&&(l.status||'').toLowerCase()!=='deleted');
    }
    // 2) pgNo+date로 찾기
    if(idx<0&&remote.pgNo&&rDate){
      idx=merged.findIndex(l=>l.pgNo===remote.pgNo&&nd(l.date)===rDate&&(l.status||'').toLowerCase()!=='deleted');
    }

    if(idx>=0){
      // ── 기존 항목 업데이트: 로컬 pgNo/id는 절대 변경하지 않음 ──
      const loc=merged[idx];
      const locRank=rankSt(getSt(loc));
      const remRank=rankSt(remote.status);
      const protect=isPending(loc.id); // 방금 이 화면에서 수정한 항목만 로컬 보호

      // ★ v93 버그 수정: 지금까지 "scanned는 항상 더 큰 값 유지"였는데, 이게
      //   매니저가 잘못 부풀려진 숫자를 낮은 값으로 직접 수정(forceScanned)해도
      //   다른 컴퓨터의 로컬 캐시에는 예전의 더 큰 값이 남아있어서 영원히 그 값을
      //   고집하며 서버의 수정된 값을 절대 못 받아오게 만드는 원인이었음
      //   (매니저 화면엔 정확히 반영되는데 작업자 화면엔 예전 값 그대로였던 문제).
      //   → worker/시간값과 동일하게: 방금(30초 이내) 이 화면에서 직접 스캔한 경우만
      //   로컬 우선 보호(Math.max로 순간적 역행 방지), 그 외에는 서버 값을 그대로 신뢰.
      const newScanned=protect?Math.max(loc.scanned||0, remote.scanned||0):(remote.scanned??loc.scanned??0);
      // worker/시간값: 30초 이내 로컬 수정이 있으면 로컬 우선, 아니면 서버(다른 기기 포함) 신뢰
      const newWorker=protect?(loc.worker||remote.worker||''):(remote.worker||loc.worker||'');
      const newPickStart=protect?(loc.pickStart||remote.pickStart||''):(remote.pickStart||loc.pickStart||'');
      const newPickEnd=protect?(loc.pickEnd||remote.pickEnd||''):(remote.pickEnd||loc.pickEnd||'');
      const newScanStart=protect?(loc.scanStart||remote.scanStart||''):(remote.scanStart||loc.scanStart||'');
      const newScanEnd=protect?(loc.scanEnd||remote.scanEnd||''):(remote.scanEnd||loc.scanEnd||'');

      merged[idx]={
        ...loc,                    // ★ 로컬 데이터 기반 (pgNo, id 등 로컬 유지)
        orderCount:remote.orderCount||loc.orderCount||0,
        sku:remote.sku||loc.sku||0,
        pages:remote.pages||loc.pages||0,
        scanned:newScanned,
        worker:newWorker,
        pickStart:newPickStart,
        pickEnd:newPickEnd,
        scanStart:newScanStart,
        scanEnd:newScanEnd,
        memo:loc.memo||remote.memo||'',
        skipReason:loc.skipReason||remote.skipReason||'',
        workerDurations:loc.workerDurations||remote.workerDurations||'',
      };
    } else {
      // ── 새 항목: remote에서 추가 ──
      // ★ v62 버그 수정: targetDate==='' (전체 동기화) 일 때 rDate===targetDate가
      //   절대 참이 될 수 없어서 새 레코드가 영원히 추가 안 되던 문제 수정.
      //   targetDate==='' 이면 모든 날짜의 새 레코드를 추가.
      if(targetDate===''||rDate===targetDate){
        merged.push({
          id:remote.id||('gs_'+remote.pgNo+'_'+rDate),
          date:rDate,
          pgNo:remote.pgNo,
          category:normalizeCat(remote.category),
          sku:remote.sku||0,
          pages:remote.pages||0,
          orderCount:remote.orderCount||0,
          scanned:remote.scanned||0,
          worker:remote.worker||'',
          pickStart:remote.pickStart||'',
          pickEnd:remote.pickEnd||'',
          scanStart:remote.scanStart||'',
          scanEnd:remote.scanEnd||'',
          status:remote.status||'Pending',
          memo:remote.memo||'',
          skipReason:remote.skipReason||'',
          workerDurations:remote.workerDurations||'',
        });
      }
    }
  });

  return merged;
};

async function syncData(url,action,payload){
  if(!url)return;
  try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,...payload})});}catch(e){console.warn('syncData error:',e);}
}
async function syncDataAwait(url,action,payload){
  // syncData는 no-cors라 응답을 못 읽음. TT 저장처럼 결과가 필요한 곳에서 사용.
  if(!url)return{ok:false,error:'no url'};
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,...payload})});
    return await r.json();
  }catch(e){return{ok:false,error:e.message};}
}
// ★ v142 버그 수정: syncDataAwait는 fetch에 타임아웃이 전혀 없어서, 서버 응답이 느리거나
// 네트워크가 끊긴 경우 요청 하나가 무한정 매달릴 수 있었다. 순차 처리 루프(예: 일괄 완료
// 처리)에서 이 함수를 쓰면, 단 한 건이 응답을 안 주는 것만으로 나머지 전체가 영원히
// "처리 중…" 상태로 멈춰버림(실사례: 103건 일괄 완료 처리가 6분 넘게 끝나지 않음).
// → AbortController로 지정 시간 안에 응답이 없으면 확실히 포기하고 실패로 처리해서,
// 다음 항목으로 넘어갈 수 있게 한다.
async function syncDataAwaitTimeout(url,action,payload,timeoutMs){
  if(!url)return{ok:false,error:'no url'};
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs||10000);
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,...payload}),signal:ctrl.signal});
    return await r.json();
  }catch(e){return{ok:false,error:(e.name==='AbortError'?'timeout':e.message)};}
  finally{clearTimeout(timer);}
}

/* ══════════════════════════════════════════════
   TIKTOK CBT — 라벨 PDF / SKU 마스터 파싱 + 바코드 매칭
   (기존에 검증된 독립형 CBT 스캔 도구에서 그대로 이식.
   서버 저장이 필요한 부분만 localStorage → GAS 백엔드로 교체됨)
══════════════════════════════════════════════ */
function stripImpbPrefix(digits){
  if(/^420\d{5}/.test(digits))return digits.slice(8);
  return digits;
}
const TTCarrierNormalizers={
  USPS(raw){const digits=raw.replace(/\D/g,'');return stripImpbPrefix(digits);},
  UPS(raw){const m=raw.toUpperCase().match(/1Z[0-9A-Z]{16}/);return m?m[0]:raw.trim();},
  FEDEX(raw){return raw.replace(/\D/g,'');},
  FEDEX_SMARTPOST(raw){const digits=stripImpbPrefix(raw.replace(/\D/g,''));return digits.length>=12?digits.slice(-12):digits;},
  DEFAULT(raw){return raw.trim();}
};
function ttDetectCarrier(raw){
  const trimmed=raw.trim();
  if(/^1Z/i.test(trimmed)||/1Z[0-9A-Z]{16}/i.test(trimmed.toUpperCase()))return'UPS';
  const digits=trimmed.replace(/\D/g,'');
  const allDigits=digits.length===trimmed.replace(/\s/g,'').length;
  if(!allDigits)return'DEFAULT';
  if(/^420\d{5}/.test(digits))return'USPS';
  if(digits.length>=30&&digits.length<=36&&/^9/.test(digits))return'FEDEX_SMARTPOST';
  if(digits.length>=18||/^9/.test(digits))return'USPS';
  if([12,15].includes(digits.length))return'FEDEX';
  return'DEFAULT';
}
function ttNormalizeBarcode(raw){
  const trimmed=(raw||'').toString().trim();
  const carrier=ttDetectCarrier(trimmed);
  const fn=TTCarrierNormalizers[carrier]||TTCarrierNormalizers.DEFAULT;
  const normalized=fn(trimmed);
  const candidates=[];
  const add=v=>{if(v&&!candidates.includes(v))candidates.push(v);};
  add(trimmed);add(normalized);
  const digitsOnly=trimmed.replace(/\D/g,'');
  add(digitsOnly);
  if(digitsOnly.length>12)add(digitsOnly.slice(-12));
  if(digitsOnly.length>15)add(digitsOnly.slice(-15));
  if(digitsOnly.length>22)add(digitsOnly.slice(-22));
  return{raw:trimmed,carrier,normalized,candidates};
}

const TT_RE_DATAROW=/^(.*?)\b([A-Za-z][A-Za-z0-9._]{1,14}(?:-[A-Za-z0-9._]{1,14}){1,3})\b\s*(\$[\d,]+\.\d{2})?\s*(\d{1,4})\s*$/;

async function ttGetPageLines(page){
  const content=await page.getTextContent();
  const rows={};
  content.items.forEach(item=>{
    const y=Math.round(item.transform[5]/3)*3;
    if(!rows[y])rows[y]=[];
    rows[y].push({x:item.transform[4],str:item.str});
  });
  const ys=Object.keys(rows).map(Number).sort((a,b)=>b-a);
  return ys.map(y=>rows[y].sort((a,b)=>a.x-b.x).map(t=>t.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
}

// ★ v144: OCR 워커는 생성 비용(엔진+언어데이터 다운로드)이 커서, 여러 페이지/여러 파일에
//   걸쳐 하나만 만들어 재사용한다(파일마다 새로 만들지 않음). 업로드 세션이 끝나면
//   ttReleaseOcrWorker()로 정리.
let _ttOcrWorkerPromise=null;
function ttGetOcrWorker(){
  if(!_ttOcrWorkerPromise){
    _ttOcrWorkerPromise=(async()=>{
      const w=await Tesseract.createWorker('eng');
      // PSM 6 = "균일한 텍스트 블록" 가정. 라벨/패킹슬립은 표 형태의 정형 텍스트라 이 모드가
      // 자유 문단(기본 PSM 3)보다 줄 순서를 훨씬 안정적으로 유지함.
      await w.setParameters({tessedit_pageseg_mode:'6'});
      return w;
    })();
  }
  return _ttOcrWorkerPromise;
}
async function ttReleaseOcrWorker(){
  if(_ttOcrWorkerPromise){
    try{const w=await _ttOcrWorkerPromise;await w.terminate();}catch(e){}
    _ttOcrWorkerPromise=null;
  }
}

// ★ v144: 텍스트 레이어가 없는 페이지를 캔버스에 렌더링한 뒤 OCR로 줄 단위 텍스트를 뽑는다.
//   ttGetPageLines와 최대한 비슷한 모양(줄 문자열 배열)으로 반환해서, 아래
//   ttParsePdfFile의 파싱 로직(processPageLines)이 텍스트 추출이든 OCR이든 구분 없이
//   그대로 재사용 가능하게 함. scale 2.2 ≈ 150~200dpi 상당 — 낮추면 인식률이 떨어지고
//   올리면 페이지당 처리 시간이 늘어남(실측: 100dpi에서 페이지당 약 1초).
async function ttOcrPageLines(page, worker){
  const viewport=page.getViewport({scale:2.2});
  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil(viewport.width);
  canvas.height=Math.ceil(viewport.height);
  const ctx=canvas.getContext('2d');
  await page.render({canvasContext:ctx,viewport}).promise;
  const{data:{text}}=await worker.recognize(canvas);
  return text.split('\n').map(l=>l.trim()).filter(Boolean);
}

// ★ v145: OCR한 배송 라벨 줄들 중에서 "트래킹 번호로 보이는" 토큰을 뽑는다.
//   실사례(_CBT__08726_TT_SK__1.pdf): 패킹슬립 자체엔 트래킹 번호가 원본부터 공란이고,
//   진짜 번호는 바로 앞장 배송 라벨(이미지, 텍스트 없음)에 큰 글씨로 딱 한 줄 찍혀있음
//   (바코드 바로 아래, 예: "GFUS01067941488837").
// ★ v147 버그 수정: v145은 "영문+숫자로만 구성된 8자 이상 줄 중 제일 긴 것"을 골랐는데,

//   "Order #:" 참조번호(예: "2967596085701940027", 19자 순수 숫자)가 같이 찍혀있으면,
//   숫자만 더 긴 그 참조번호를 트래킹으로 잘못 채택해버리는 문제가 있었다(실사례: Cassandra
//   Lor 주문 — OnTrac 참조번호가 트래킹으로 잘못 저장됨). → 1) GFUS/UUS/SWX/1Z 등 이미
//   알려진 캐리어 트래킹 접두사가 있으면 최우선 채택, 2) 없으면 "순수 숫자 18자 이상"(캐리어
//   참조번호일 가능성이 높음)은 후보에서 제외한 뒤 나머지 중 가장 긴 것을 채택 — 이렇게 하면
//   기존 GOFO(GFUS 접두사) 인식엔 영향 없이, OnTrac류의 오채택만 걸러진다.
function ttExtractTrackingFromOcrLines(lines){
  const KNOWN_PREFIX=/^(GFUS|UUS|SWX|1Z)/;
  // ★ v148 버그 수정: UPS 라벨은 "TRACKING #: 1Z 197 A1D 03 2320 9326"처럼 문자+숫자가
  //   섞인 그룹을 공백으로 띄어 인쇄하는데, v147의 "여러 단어면 전부 순수 숫자여야 후보 인정"
  //   필터가 이 형식 자체를 통째로 걸러내고 있었다(실사례: Briana Taylor 주문). UPS는 라벨에
  //   "TRACKING #:" 문구를 직접 인쇄해주므로, 이 문구가 있으면 그 뒤 값을 최우선/가장 신뢰도
  //   높은 신호로 채택한다.
  const blob=lines.join('\n');
  const explicit=blob.match(/TRACKING\s*#?\s*:?\s*([0-9A-Z][0-9A-Z ]{6,30}[0-9A-Z])/i);
  if(explicit){
    const val=explicit[1].replace(/\s+/g,'').toUpperCase();
    // ★ v148: USPS 라벨은 "USPS TRACKING # USPS Ship"처럼 헤더 텍스트 자체에도 "TRACKING"이
    //   들어있어서, 위 정규식이 진짜 번호(다음 줄) 대신 "USPS Ship" 같은 글자를 잘못 캡처할
    //   수 있었다(실사례로 테스트 중 발견) — 캡처값에 숫자가 하나도 없으면 무효로 보고
    //   아래 줄 단위 후보 탐색으로 넘어간다(그쪽에서 그룹숫자 트래킹 줄을 정상적으로 찾음).
    if(/^[A-Z0-9]{8,30}$/.test(val) && /\d/.test(val))return val;
  }
  const candidates=[];
  for(const raw of lines){
    const trimmed=raw.trim();
    if(!trimmed)continue;
    // ★ v147: "3339 AUNTINE BURNEY ST" 같은 여러 단어짜리 주소/텍스트 줄이 공백만 지우면
    //   영숫자 문자열처럼 보여 후보로 잘못 끼어드는 문제 방지.
    // ★ v148: 다만 UPS "1Z 197 A1D 03 2320 9326"처럼 문자+숫자 그룹을 띄어 쓰는 정상
    //   트래킹 형식까지 같이 걸러지지 않도록, 압축값이 알려진 캐리어 접두사(1Z 등)로
    //   시작하면 여러 단어여도 후보로 인정한다.
    const tokens=trimmed.split(/\s+/);
    const compact=trimmed.replace(/\s+/g,'').toUpperCase();
    if(tokens.length>1){
      const allDigits=tokens.every(t=>/^\d+$/.test(t));
      const startsKnown=KNOWN_PREFIX.test(compact);
      if(!allDigits && !startsKnown)continue;
    }
    if(/^[A-Z0-9]{8,25}$/.test(compact) && /\d/.test(compact)){
      candidates.push(compact);
    }
  }
  if(!candidates.length)return null;
  const known=candidates.find(c=>KNOWN_PREFIX.test(c));
  if(known)return known;
  const nonRefLike=candidates.filter(c=>!/^\d{18,}$/.test(c)); // 순수 숫자 18자+ 는 참조번호일 가능성 높아 제외
  const pool=nonRefLike.length?nonRefLike:candidates;
  return pool.reduce((a,b)=>b.length>a.length?b:a);
}

// ★ v98: 배송 라벨 페이지(Packing Slip이 아니라 Order ID가 없는 페이지)에서
//   실제 수령인 이름을 뽑아낸다. 캐리어마다 포맷이 달라서 확인된 2가지 패턴을 지원:
//   ① UniUni 등: "Deliver to: 이름"이 한 줄에 같이 나옴
//   ② StyleKorean/OnTrac 등: "Ship To" 헤더 다음 줄에 이름이 옴
//   트래킹 번호도 함께 뽑아서(명시된 라벨 우선, 없으면 바코드 밑 순수 영숫자 코드 추정)
//   나중에 Packing Slip에서 얻은 trackingIds와 매칭하는 데 사용한다.
function ttTryCaptureLabelName_(pageText, lines, out){
  let name=null;
  const m1=pageText.match(/Deliver to:\s*([^\n]+)/i);
  if(m1)name=m1[1].trim();
  if(!name){
    const idx=lines.findIndex(l=>/^Ship\s*to:?$/i.test(l.trim()));
    if(idx>=0){
      for(let i=idx+1;i<lines.length&&i<idx+4;i++){
        const cand=lines[i].trim();
        if(cand){name=cand;break;}
      }
    }
  }
  if(!name)return;
  // ★ v110: 실명에도 동일하게 깨진 폰트 글리프 정리 적용
  name=name.replace(/[\uE000-\uF8FF\uFFFD\uFFFE\uFFFF\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/\s{2,}/g,' ').trim();
  if(!name)return;
  let trackingRaw=null;
  const m2=pageText.match(/Tracking\s*Number:?\s*([A-Za-z0-9]+)/i);
  if(m2)trackingRaw=m2[1];
  else{
    const cand=lines.find(l=>/^[A-Z0-9]{10,25}$/.test(l.trim()));
    if(cand)trackingRaw=cand.trim();
  }
  if(trackingRaw)out.push({trackingRaw,name});
}

/* PDF 1개를 파싱해서 {orders, newOrderCount, skippedPages, totalPages, ocrUsed, ocrPagesScanned, ocrOrdersFound} 반환.
   기존 orders 객체를 넘기면 같은 파일 안에서 여러 페이지에 걸친 같은 주문을 이어 붙인다.
   ★ v144: opts.onOcrStart(fileName,pageCount) / opts.onOcrProgress(fileName,i,total) — 이 파일이
   이미지형으로 판정되어 OCR 폴백이 돌 때 호출되는 진행상황 콜백(업로드 UI에 "OCR 처리 중…" 표시용). */
async function ttParsePdfFile(file, ordersAcc, opts){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const orders=ordersAcc||{};
  let curId=null,curTrackingSet=new Set(),curBuyer='',curItems=[];
  // ★ v145: 주문 하나가 시작되기 직전까지 연속으로 스킵됐던 페이지 번호들 — 대부분
  //   "그 주문의 배송 라벨"이라서, 나중에 그 주문의 트래킹이 비어있으면 이 페이지들만
  //   골라서 OCR로 다시 시도한다(파일 전체 OCR과 무관하게 항상 동작하는 좁은 안전장치).
  let pendingLabelPages=[];
  const labelPagesByOrder={};
  let curViaOcr=false; // ★ v144: 현재 누적 중인 주문(curId)이 OCR 경로 페이지를 포함하는지
  let pendingName='',insideCombineParent=false,pendingIsComponent=false;
  // ★ v94 버그 수정: "Combine listing"(세트상품) 헤더 줄의 수량을 지금까지 그냥 버리고
  //   있었음 — 세트 자체가 몇 개 주문됐는지(예: 2세트)를 기억해뒀다가, 그 아래 딸린
  //   구성품(•)들의 "라벨에 적힌 1개"에 곱해줘야 정확한 필요수량이 나옴.
  let pendingParentQty=1;
  let newOrderCount=0,skippedPages=0;
  const labelCandidates=[]; // ★ v98: {trackingRaw,name} — 배송 라벨에서 뽑은 실명 후보들

  function flush(){
    if(!curId)return;
    if(!orders[curId]){orders[curId]={orderId:curId,trackingIds:[],buyer:'',items:[]};newOrderCount++;}
    // ★ v144: 이 주문이 OCR 폴백으로 채워졌으면 표시해서, 화면에서 매니저가 한 번 더
    //   실물과 대조해볼 수 있게 함(OCR은 문자 인식 오류 가능성이 텍스트 추출보다 높음).
    if(curViaOcr)orders[curId].ocrParsed=true;
    curTrackingSet.forEach(t=>{if(t&&!orders[curId].trackingIds.includes(t))orders[curId].trackingIds.push(t);});
    if(!orders[curId].buyer&&curBuyer)orders[curId].buyer=curBuyer;
    // ★ v135 버그 수정: 같은 주문의 패킹슬립 페이지가 PDF 안에 두 번 이상 나타나면(중복 인쇄,
    // "_Copy" 파일처럼 중복 페이지 포함 등), flush()가 이 주문에 대해 여러 번 호출된다.
    // 기존엔 orders[curId].items.push(...curItems)로 무조건 이어 붙였는데, 이러면 curItems
    // 내부 병합(같은 sellerSku 합산)은 "연속으로 이어지는 같은 주문"일 때만 적용되고,
    // flush()가 나중에 재호출될 때는 병합 없이 그대로 추가돼서 실제로는 1개짜리 단품
    // 주문인데 같은 SKU가 "1/1 완료" + "0/1 대기" 두 줄로 쪼개져 보이는 문제가 있었음
    // (작업자가 실물은 1개뿐인데 시스템은 2개를 요구 → 두 번째 줄은 영원히 스캔 불가).
    // ★ v138 버그 수정 (v135의 잘못된 후속 조치): v135는 이걸 "수량 합산"으로 고쳤는데,
    // 실제로 확인해보니 이 파일(17건_Copy.pdf 등)은 "같은 페이지가 통째로 중복 인쇄"된
    // 경우였다 — 실물은 1개인데 페이지만 2번 찍힌 것. 이 경우 합산하면 필요수량이
    // 1→2로 부풀려져서, 존재하지도 않는 두 번째 실물을 스캔하라고 요구하는 정반대
    // 문제가 새로 생겼다(실사례: SBMSKIT-SET, MECUS21-S, MECUS09-CS 등 Qty Total:1인데
    // 화면엔 required=2로 표시됨). "세트 안에서 같은 부품이 여러 그룹에 쓰이는 경우"의
    // 합산(curItems 내부 병합, 바로 위 별도 로직)은 계속 정당하지만, 이 flush() 간
    // 재등장은 페이지 중복일 가능성이 훨씬 높으므로 합산이 아니라 "더 큰 값 유지"로
    // 바꾼다 — 중복이면 값이 같아 영향 없고, 실제로 더 필요한 경우여도 최소 그 값은
    // 보존된다(합산처럼 실제보다 부풀리지는 않음).
    curItems.forEach(it=>{
      const existing=orders[curId].items.find(x=>x.sellerSku===it.sellerSku);
      if(existing){existing.qty=Math.max(existing.qty,it.qty);if(it.isSetComponent)existing.isSetComponent=true;}
      else orders[curId].items.push({...it});
    });
    curItems=[];
  }

  // ★ v144: 페이지 1개를 파싱하는 로직을 함수로 분리. 텍스트 추출(pdfjs)이든 OCR이든
  //   결과가 "줄 문자열 배열"이기만 하면 동일하게 처리 가능 — 아래 1차(텍스트 추출) /
  //   2차(이미지형 파일 한정 OCR 폴백) 패스 양쪽에서 그대로 재사용한다.
  //   반환값: 이 페이지가 실제 Packing Slip(Order ID 발견)이었으면 true, 아니면 false.
  function processPageLines(lines, viaOcr, pageNum){
    const pageText=lines.join('\n');
    const idMatch=pageText.match(/Order ID:\s*(\d{6,20})/);
    if(!idMatch){
      // ★ v98: Packing Slip가 아닌 배송 라벨 페이지일 수 있음 — 실명 추출 시도 후 스킵
      ttTryCaptureLabelName_(pageText,lines,labelCandidates);
      if(pageNum!=null)pendingLabelPages.push(pageNum); // ★ v145: 다음 주문의 "직전 라벨 후보"로 기록
      return false;
    }
    const newId=idMatch[1];
    if(newId!==curId){
      flush();
      // ★ v145: 이 주문(newId)이 시작되기 직전까지 쌓여있던 라벨 후보 페이지들을 이
      //   주문 소유로 확정 — 이후 이 주문의 트래킹이 끝까지 비어있으면 이 페이지(들)만
      //   OCR로 재시도한다.
      if(!labelPagesByOrder[newId])labelPagesByOrder[newId]=pendingLabelPages.slice();
      pendingLabelPages=[];
      curId=newId;curTrackingSet=new Set();curBuyer='';pendingName='';insideCombineParent=false;pendingIsComponent=false;pendingParentQty=1;curViaOcr=false;
    } else {
      pendingLabelPages=[]; // 같은 주문의 연속 페이지 — 다음 주문 몫과 섞이지 않도록 비움
    }
    if(viaOcr)curViaOcr=true; // ★ v144: flush() 시점에 이 주문을 ocrParsed로 표시하기 위한 신호
    // ★ v101 버그 수정: 트래킹번호가 라벨 폭 때문에 다음 줄로 개행되고, 그 뒤로
    // "SKU Price" 헤더 줄이 이어지는 실제 케이스에서, 기존엔 "Product Name" 줄까지
    // 못 끊고 그 사이 텍스트("6", "SKU Price" 등)까지 트래킹번호에 통째로 붙어버렸음.
    // ★ v134 버그 수정: USPS Ground Advantage 라벨처럼 "In transit by: ... Tracking"까지
    //   한 줄이 꽉 차서 "Tracking"과 "number:"가 줄바꿈으로 갈라지고, 그 사이에 트래킹
    //   번호 자체가 끼어드는 실제 레이아웃이 확인됨:
    //     "In transit by: 08/14/2026 11:59 PM Tracking 9200190417705009494595"
    //     "number:"
    //   기존 정규식은 "Tracking number:"가 붙어 있어야만 매칭돼서, 이 경우 트래킹 번호를
    //   통째로 못 뽑고 trackingIds가 빈 배열로 남았음. 그러면 라벨 바코드를 스캔해도
    //   서버에 매칭할 트래킹 정보가 없어 "해당 주문을 찾을 수 없습니다"로 스캔이 막힘
    //   (실사례: Order 577521882938446838, tracking 9200190417705009494595).
    //   → "Tracking"과 "number:" 사이에 다른 텍스트(번호 포함 무엇이든)가 끼어도, 그
    //   "Tracking"과 "number:" 둘 다 있는 구간에서 가장 뒤에 오는 순수 영숫자 토큰을
    //   트래킹 번호로 우선 채택. 기존 "Tracking number:X" 형태는 그대로 매칭되므로
    //   하위호환 유지.
    // ★ v146 버그 수정: "Tracking number:" 뒤가 원본부터 공란이고 바로 다음 줄이 표 헤더
    //   ("SKU Price" 등)로 시작하는 실제 케이스(_CBT__08726_TT_SK__1.pdf 200건)에서, 위
    //   lookahead 정규식이 그 헤더 텍스트 자체를 트래킹 번호인 것처럼 캡처해버리는 문제가
    //   있었다(예: trackingIds에 "SKUPrice"라는 쓰레기 값이 저장됨). 진짜 트래킹이 아예
    //   없는데도 "비어있지 않다"고 오판되면서, 바로 아래 3차 패스(트래킹 공란 주문만 OCR로
    //   복구)가 이 주문들을 전부 건너뛰는 2차 피해로 이어졌다 — 캡처된 값이 알려진 표
    //   헤더 문구 자체(또는 그걸로 시작)면 무효(빈 값)로 처리한다.
    const TT_TRACKING_STOPWORDS=/^(SKU\s*Price|Product\s*Name|Seller\s*SKU|SKU\s*Seller\s*SKU|\(Unit\)|Qty)\b/i;
    function ttCleanTrackingCapture(raw){
      if(!raw)return'';
      const trimmed=raw.trim();
      if(!trimmed||TT_TRACKING_STOPWORDS.test(trimmed))return'';
      return trimmed.replace(/\s+/g,'');
    }
    let trackMatch=pageText.match(/Tracking number:\s*([\s\S]*?)(?:\n(?:Product Name|Order ID:|Buyer ID:|SKU Price|SKU Seller SKU)|$)/);
    let trackVal=trackMatch?ttCleanTrackingCapture(trackMatch[1]):'';
    if(!trackVal){
      const tSplit=pageText.match(/Tracking\b([\s\S]*?)\bnumber:\s*([\s\S]*?)(?:\n(?:Product Name|Order ID:|Buyer ID:|SKU Price|SKU Seller SKU)|$)/i);
      if(tSplit){
        const between=(tSplit[1]||'').trim();
        // "Tracking"과 "number:" 사이에 낀 토큰(번호) 우선, 없으면 "number:" 뒤 텍스트 사용
        const betweenTok=between.split(/\s+/).filter(Boolean).pop();
        const afterVal=ttCleanTrackingCapture(tSplit[2]);
        trackVal=(betweenTok&&/^[A-Za-z0-9]{8,}$/.test(betweenTok))?betweenTok:afterVal;
      }
    }
    if(trackVal)curTrackingSet.add(trackVal);
    const buyerMatch=pageText.match(/Buyer Nickname:\s*(.+)/);
    // ★ v110 버그 수정: 일부 라벨 PDF가 이모지 등 특수문자를 폰트에 제대로 매핑 못 해서,
    // 텍스트 추출 시 깨진 글리프(유니코드 사설영역 문자 등)가 그대로 섞여 들어와 이름이
    // "lore□□♥ □□"처럼 깨져 보이는 문제. PDF 폰트 자체의 한계라 원래 문자 복원은 불가능
    // 하지만, 최소한 깨진 문자는 걸러내서 지저분하게 보이지 않도록 정리.
    if(buyerMatch&&!curBuyer)curBuyer=buyerMatch[1].replace(/[\uE000-\uF8FF\uFFFD\uFFFE\uFFFF\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/\s{2,}/g,' ').trim();

    // ★ v101: 방금 데이터행(SKU+수량)을 찾아 만든 아이템 참조. 실제 레이블 원본으로 확인해보니
    //   SKU/가격/수량은 상품명 블록의 "첫 줄"에 있고, 줄바꿈된 나머지 설명은 그 아래로
    //   이어지는 구조였음(기존 코드는 반대로 "마지막 줄에 데이터가 온다"고 가정해서 상품명이
    //   항상 첫 줄만 남고 뒷부분이 통째로 유실되고 있었음). 데이터행을 찾은 뒤 이어지는
    //   줄바꿈 텍스트는 이 아이템의 productName에 계속 붙여준다.
    let lastPushedItem=null;
    // ★ v101 버그 수정: 트래킹 번호가 라벨 폭을 넘어가면 다음 줄로 개행되는데("...395" 다음
    //   줄에 "6"만 남는 식), 그 잔여 텍스트가 상품명 파싱에 그대로 섞여 들어가던 문제.
    //   "Tracking number:" 이후 "Product Name" 헤더가 나오기 전까지는(개행 잔여 + 헤더행
    //   포함) 전부 건너뛴다.
    let skipUntilHeader=false;

    for(let li=0; li<lines.length; li++){
      const rawLine=lines[li];
      if(/^Tracking number:/i.test(rawLine)){skipUntilHeader=true;lastPushedItem=null;continue;}
      if(skipUntilHeader){
        if(/^Product Name\b/i.test(rawLine))skipUntilHeader=false;
        else continue;
      }
      if(TT_NOISE_RE.some(re=>re.test(rawLine))){lastPushedItem=null;continue;}
      // ★ v97 버그 수정: "SKU" 컬럼(항상 "Default" — 실제 파싱엔 Seller SKU만 쓰고 이 값은 안 씀)이
      //   세트상품(Combine listing)처럼 여러 줄로 감싸지는 상품명과 같은 y좌표에 겹쳐 찍히면서
      //   상품명 문자열 중간에 "Default"가 섞여 들어가는 문제. 아래서 SKU/제품명 매칭 전에 제거.
      const line=rawLine.replace(/\bDefault,?\s*/gi,'').replace(/\s{2,}/g,' ').trim();
      if(!line)continue;
      // ★ v97 버그 수정: "Combine listing" 줄을 지금까지 보자마자 무조건 버렸는데(continue),
      //   실제 라벨에선 이 줄 자체에 세트의 Seller SKU + 주문수량이 같은 줄에 함께 찍혀 있는
      //   경우가 있었음. 그걸 확인 없이 버려서 세트의 수량 정보가 사라지고, 그 아래 모든
      //   구성품(•) 줄의 이름↔SKU 매칭이 한 칸씩 밀려버렸던 것(레이블 실사례로 확인됨).
      //   → 더 이상 무조건 버리지 않고, 이 줄도 동일하게 데이터행 매칭을 시도한다.
      const isComboMarkerLine=/Combine listing/i.test(line);
      if(isComboMarkerLine){
        insideCombineParent=true;pendingName='';pendingIsComponent=false;lastPushedItem=null;
        // ★ v113 버그 수정: 세트 부모줄(Combine listing)의 세트 SKU가 상품명 줄바꿈 때문에
        // 하이픈 없이 끊겨서(예: "MECUHS13"만 이 줄에 남고 "-PDGDUO"는 다음 줄로 넘어감)
        // TT_RE_DATAROW가 요구하는 "SKU에 하이픈 최소 1개" 조건을 못 만족해 매칭 자체가
        // 실패하는 경우가 있었음. 그러면 아래 정상 매칭 경로에서 pendingParentQty가 전혀
        // 갱신되지 못하고 기본값 1로 남아, 실제로는 세트를 2개 이상 주문한 경우에도
        // 구성품 필요수량이 항상 1개로 저장되는 치명적 과소 집계 버그로 이어졌음
        // (예: MECUHS13-PDGDUO 세트 2개 주문 건에서 샴푸/컨디셔너가 각 1개씩만 필요수량으로
        // 잡혀, 작업자가 실제로 챙긴 나머지 1개씩이 스캔할 곳 없이 잔여 재고로 남음).
        // → 부모줄은 세트 SKU 자체를 쓰지 않으므로(구성품 SKU만 실제 사용됨), SKU 매칭에
        // 의존하지 않고 줄 끝의 숫자(세트 주문 수량)만 별도로 즉시 캡처해 안전망으로 둔다.
        const parentQtyOnly=line.replace(/Combine listing/i,'').trim().match(/(\d{1,4})\s*$/);
        if(parentQtyOnly)pendingParentQty=parseInt(parentQtyOnly[1],10)||1;
      }else if(/^[•+]/.test(line)){
        // ★ v149 버그 수정: OCR(이미지형 PDF)로 처리된 세트 상품 구성품 줄은 원본의 "•"가
        //   Tesseract에서 "+"로 잘못 인식되는 실제 사례가 확인됨(_CBT__08726_TT_SK__2.pdf,
        //   Elizavecca 3종 세트 주문 — "+ [Elizavecca] CER-100... SESALOHS02-CCPTR 1").
        //   기존엔 "•"만 구성품 시작으로 인식해서, 이 "+" 줄들이 계속 "세트 요약행"으로
        //   착각되어(insideCombineParent가 계속 true로 남음) 구성품 3개가 전부 통째로
        //   버려지고 items가 빈 배열이 되는 문제가 있었음 — 화면엔 "제품 정보를 인식하지
        //   못했습니다"만 뜨고 실제로는 존재하는 3개 구성품이 전혀 안 보이게 됨.
        // ★ v97: 세트 헤더(Combine listing) 요약행이 자체 데이터를 이미 소비한 뒤에도
        //   그 설명문 나머지 줄(잔여 텍스트)이 pendingName에 남아있다가 첫 구성품 이름
        //   앞에 그대로 붙어버리는 문제 — 새 구성품(•) 시작 시 pendingName도 함께 리셋.
        insideCombineParent=false;pendingIsComponent=true;pendingName='';lastPushedItem=null;
      }
      const dataSrc=isComboMarkerLine?line.replace(/Combine listing/i,'').trim():line;
      let m=dataSrc.match(TT_RE_DATAROW);
      let consumedNextLine=false;
      // ★ v136 버그 수정: v113이 "Combine listing" 부모줄의 세트 SKU가 줄바꿈으로 끊기는
      // 경우만 방어했는데, 똑같은 문제가 일반 단품/구성품의 Seller SKU에서도 발생함이
      // 실사례로 확인됨 (예: "US_TKBSM05"가 한 줄에서 끊기고 "-STCOA23 $78.00 1"이 다음
      // 줄로 넘어감). 이 경우 두 줄 다 개별로는 TT_RE_DATAROW를 통과 못해서(하이픈 섹션
      // 요구조건 미충족) 그 상품의 SKU/수량 정보가 통째로 유실됨 — 단품 1개짜리 주문이면
      // items가 완전히 빈 배열이 되어 "제품 정보를 인식하지 못했습니다"로 스캔이 막힘
      // (실사례: 주문 577520058299617911, US_TKBSM05-STCOA23).
      // → 이 줄이 매칭 실패하고 다음 줄이 있으면, 공백 없이 바로 이어붙여서 한 번 더
      //   시도한다(PDF 줄바꿈은 원래 문자 사이에 공백이 없었으므로 그대로 붙이는 게 맞음).
      //   성공하면 다음 줄은 이미 소비했으므로 루프에서 건너뛴다.
      if(!m&&li+1<lines.length){
        const nextRaw=lines[li+1];
        // ★ v140 긴급 버그 수정 (v136이 세트/Combine listing 주문을 전부 깨뜨리고 있었음):
        // v136은 "매칭 실패한 줄 + 다음 줄"을 조건 없이 이어붙여 재시도했다. 문제는 세트
        // 주문에서 구성품 설명문의 마지막 줄(예: "Spots & Bumpy Skin")이 매칭 실패하는 게
        // 지극히 정상인데, 그 "다음 줄"이 하필 다음 구성품의 시작줄("• [Medicube] ...
        // MECUBS14-BOPS 1")이라서, 둘을 이어붙이면 우연히 SKU+수량 패턴이 걸려버려
        // "매칭 성공"으로 오인됐다. 그 결과 다음 구성품 전체가 통째로 삼켜지고
        // (insideCombineParent가 아직 true인 상태라 부모줄로 착각해 버려짐), 그 구성품의
        // 실제 시작줄도 "이미 처리됨"으로 건너뛰어지면서 세트 주문 전체가 도미노로 깨졌다
        // (실사례: 577524079610467316 — 세트 구성품 3개가 통째로 사라지고 마지막 낱개
        // 상품 1개만 남음). 단품 주문은 설명문 다음 줄이 대부분 Order ID/Buyer ID 같은
        // 노이즈라 이 충돌이 거의 안 일어나서 멀쩡해 보였던 것.
        // → v136이 막으려던 실제 케이스(SKU가 "US_TKBSM05" / "-STCOA23 $78.00 1"처럼
        // 하이픈 중간에서 끊기는 것)는 항상 다음 줄이 "-"로 시작한다는 확실한 특징이 있다.
        // 그 특징이 있을 때만 병합을 시도하도록 좁혀서, 위와 같은 우연한 오매칭을 막는다.
        if(/^-/.test(nextRaw.trim())&&!TT_NOISE_RE.some(re=>re.test(nextRaw))&&!/^Tracking number:/i.test(nextRaw)){
          const nextLine=nextRaw.replace(/\bDefault,?\s*/gi,'').replace(/\s{2,}/g,' ').trim();
          const merged=dataSrc+nextLine;
          const m2=merged.match(TT_RE_DATAROW);
          if(m2){m=m2;consumedNextLine=true;}
        }
      }
      // ★ v150 버그 수정: v136/v140은 "다음 줄 전체가 -STCOA23 형태로 시작"하는 경우만
      //   다뤘는데, 실사례(2026-08-18 신규 배치, 주문 577529409468273525)로 확인된 건 다른
      //   변형이었음 — SKU가 "US_TKBSM05-"처럼 하이픈만 남기고 끊기고, 진짜 이어지는 부분
      //   ("STCOA23")은 다음 줄 "맨 끝 단어"로만 붙어있고 그 앞은 상품명 설명 줄바꿈 텍스트
      //   ("Care & SPF Set - Complete Day STCOA23" — 상품명 2번째 줄과 SKU 조각이 같은
      //   y좌표라 pdfjs가 한 줄로 합쳐버림). v136 조건(`/^-/.test(nextRaw)`)에는 안 걸려서
      //   그대로 items가 빈 배열이 되고("제품 정보를 인식하지 못했습니다"), SKU 마스터에
      //   분명히 있는 상품인데도 스캔 시 "찾을 수 없음"으로 뜨는 원인이었음.
      //   → 현재 줄이 "SKU 하이픈에서 끊긴 채 가격/수량까지는 정상"인 패턴이면, 다음 줄의
      //   맨 끝 단어만 SKU 조각으로 떼어와 붙인다. v136과 달리 다음 줄 전체를 통째로
      //   삼키지 않고, 떼어간 단어만 지운 나머지(상품명 설명)는 다음 줄에 그대로 남겨서
      //   평소처럼 다음 루프에서 상품명에 자연스럽게 이어붙게 한다.
      // ★ v151 버그 수정: v150(하이픈 끊김 SKU 병합)이 세트상품 설명문 중간의 우연한
      //   "단어-숫자" 패턴("...CER-100"처럼 설명문에 등장하는 하이픈+숫자)까지 실제 데이터행
      //   으로 잘못 인식하는 부작용이 있었음(실사례: 577530852709667745, "Essence Oil 100ml
      //   / CER-100" 설명 줄이 "CER-"라는 가짜 끊긴 SKU로 오인되고, 다음 줄 마지막 단어
      //   "Muscle"이 거기 붙어 가짜 SKU "CER-Muscle"·가짜 수량 100이 만들어짐 → 그 100이
      //   세트 전체 배수로 잘못 저장되어 구성품 3개 전부 필요수량이 100으로 부풀려짐).
      //   실제 데이터행(v150이 원래 잡으려던 경우, 예: "US_TKBSM05- $78.00 1")은 항상 가격
      //   토큰($…)을 동반하는 반면, 설명문 중간의 우연한 하이픈 패턴은 가격이 없다는 점에
      //   착안 — v150 한정으로 가격을 "있어도 되고 없어도 됨"이 아니라 "반드시 있어야 함"
      //   으로 좁혀서, 진짜 줄바꿈-SKU만 잡고 설명문 오탐은 걸러낸다.
      if(!m){
        const dangling=dataSrc.match(/^(.*?)\b([A-Za-z][A-Za-z0-9._]{1,14}(?:-[A-Za-z0-9._]{1,14})*-)\s*(\$[\d,]+\.\d{2})\s*(\d{1,4})\s*$/);
        if(dangling&&li+1<lines.length){
          const nextRaw=lines[li+1];
          if(!TT_NOISE_RE.some(re=>re.test(nextRaw))&&!/^Tracking number:/i.test(nextRaw)){
            const nextTokens=nextRaw.trim().split(/\s+/);
            const lastTok=nextTokens[nextTokens.length-1];
            if(lastTok&&/^[A-Za-z0-9]{1,20}$/.test(lastTok)){
              m=[null,dangling[1],dangling[2]+lastTok,dangling[3],dangling[4]];
              nextTokens.pop();
              lines[li+1]=nextTokens.join(' ');
            }
          }
        }
      }
      if(m){
        const namePart=m[1].trim().replace(/^[•+]\s*/,'');
        const sku=m[2].replace(/\s+/g,'');
        const qty=parseInt(m[4],10)||1;
        const fullName=(pendingName+' '+namePart).trim()||sku;
        const isComponent=pendingIsComponent;
        pendingName='';pendingIsComponent=false;
        if(insideCombineParent){
          // ★ v94/v97: 이 줄이 "Combine listing"의 요약 행(세트 SKU + 세트 주문 수량).
          //   여기서 버리지 않고 수량만 기억해뒀다가 아래 구성품들에 곱해줌.
          pendingParentQty=qty;
          lastPushedItem=null; // 세트 요약행은 아이템으로 만들지 않으므로 이어붙일 대상 없음
          if(consumedNextLine)li++; // ★ v136: 병합해서 이미 소비한 다음 줄은 다시 처리하지 않음
          continue;
        }
        // ★ v94: 구성품(•)이면 라벨에 적힌 자체 수량 × 세트 주문 수량 = 실제 필요 수량
        const finalQty=isComponent?qty*pendingParentQty:qty;
        if(!isComponent)pendingParentQty=1; // 세트 그룹을 벗어난 일반 단품이면 배수 초기화
        const existing=curItems.find(it=>it.sellerSku===sku);
        if(existing){existing.qty+=finalQty;if(isComponent)existing.isSetComponent=true;lastPushedItem=existing;}
        else{const newItem={sellerSku:sku,productName:fullName,qty:finalQty,isSetComponent:isComponent};curItems.push(newItem);lastPushedItem=newItem;}
        if(consumedNextLine)li++; // ★ v136: 병합해서 이미 소비한 다음 줄은 다시 처리하지 않음
      }else if(lastPushedItem){
        // ★ v101: 데이터행 다음에 이어지는 줄바꿈된 설명 — 방금 만든 아이템 이름에 계속 붙임
        lastPushedItem.productName=(lastPushedItem.productName+' '+dataSrc).trim();
      }else{
        pendingName=(pendingName+' '+dataSrc).trim();
      }
    }
    return true;
  }

  // ── 1차 패스: pdfjs 텍스트 추출 (기존 로직, 빠름) ──
  const emptyTextPageNums=[]; // ★ v144: 텍스트 레이어가 전혀 없는 페이지 번호(이미지형 후보)
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const lines=await ttGetPageLines(page);
    const pageText=lines.join('\n');
    if(pageText.trim().length===0){
      // ★ v144: 텍스트가 "완전히" 없는 페이지만 OCR 후보로 기록한다. 텍스트가 조금이라도
      //   있는 정상적인 배송 라벨 페이지(예: UniUni "Deliver to:" 포맷)는 여기 안 걸리고
      //   바로 아래 processPageLines에서 여느 때처럼 "라벨 페이지"로 정상 스킵된다 —
      //   즉 OCR은 오직 "글자가 아예 안 뽑히는" 페이지에서만 후보가 된다(교훈 3: 좁은 조건).
      emptyTextPageNums.push(p);
      pendingLabelPages.push(p); // ★ v145: 다음 주문의 "직전 라벨 후보"로도 같이 기록
      skippedPages++;
      continue;
    }
    if(!processPageLines(lines,false,p))skippedPages++;
  }
  flush();

  // ── 2차 패스: 이미지형 PDF 한정 OCR 폴백 ──
  // ★ v144 신규: 정상 파일은 페이지의 대략 절반이 Packing Slip(텍스트 추출 가능)이어야
  //   한다. newOrderCount가 페이지 수 대비 비정상적으로 낮으면서 완전 공백 페이지 비율도
  //   높다면, 라벨을 통째로 이미지로 인쇄해서 나온 파일(실사례: _CBT__08726_TT_SK__2.pdf,
  //   414p 전부 이미지 → 200건이 소리소문없이 통째로 누락됨)일 가능성이 매우 높다고 보고
  //   그 페이지들만 OCR로 재시도한다. 임계값(0.3 / 0.15)은 일부러 널널하게 잡아서, "라벨
  //   페이지만 이미지고 슬립은 정상 텍스트"인 흔한 정상 케이스(newOrderCount가 페이지의
  //   40~50% 정도로 정상 범위)까지 잘못 걸려 매번 느려지는 일이 없도록 했다.
  let ocrUsed=false,ocrPagesScanned=0,ocrOrdersFound=0;
  const emptyRatio=pdf.numPages>0?emptyTextPageNums.length/pdf.numPages:0;
  ocrUsed=pdf.numPages>=4 && emptyRatio>0.3 && newOrderCount<pdf.numPages*0.15;

  if(ocrUsed && emptyTextPageNums.length>0){
    if(opts&&opts.onOcrStart)opts.onOcrStart(file.name,emptyTextPageNums.length);
    const worker=await ttGetOcrWorker();
    for(let i=0;i<emptyTextPageNums.length;i++){
      const p=emptyTextPageNums[i];
      ocrPagesScanned++;
      if(opts&&opts.onOcrProgress)opts.onOcrProgress(file.name,i+1,emptyTextPageNums.length);
      try{
        const page=await pdf.getPage(p);
        const ocrLines=await ttOcrPageLines(page,worker);
        if(processPageLines(ocrLines,true,p)){ocrOrdersFound++;skippedPages--;}
      }catch(e){
        // ★ 페이지 1장 OCR 실패가 파일 전체 업로드를 막지 않도록, 그 페이지만 건너뛰고 계속
        console.log('[TT OCR] page '+p+' 실패:',e);
      }
    }
    flush();
  }

  // ── 3차 패스: 트래킹 번호가 비어있는 주문 전용 타겟 OCR ──
  // ★ v145 신규: 실사례 확인(_CBT__08726_TT_SK__1.pdf) — 파일 전체는 정상적으로 텍스트
  //   추출되지만(주문 200/200 다 인식됨, 그래서 위 2차 패스 조건엔 안 걸림), 패킹슬립 자체의
  //   "Tracking number:" 필드가 원본부터 공란이고, 진짜 트래킹은 바로 앞장 배송 라벨
  //   (이미지, 텍스트 없음)에만 인쇄되어 있는 경우. 이건 "파일 단위" 판정으로는 절대 못 잡는
  //   "주문 단위" 문제라서, 파일이 아무리 멀쩡해 보여도 주문마다 개별적으로 훑어서 트래킹이
  //   진짜로 비어있는 주문만 골라 그 주문 직전 라벨 페이지(들)만 OCR로 재시도한다. 전체
  //   페이지가 아니라 "정말 트래킹이 없는 주문의 라벨"만 도니까, 파일이 정상이면 이 패스는
  //   거의 안 돈다(원칙 3 그대로 — 다만 이번 실사례처럼 한 파일 전체가 이 패턴이면 그만큼
  //   페이지 수가 나옴, 그건 정상 — 실제로 고쳐야 할 페이지 수만큼만 도는 것이 맞음).
  let trackingOcrPagesScanned=0,trackingOcrRecovered=0;
  const missingTrackingOids=Object.keys(orders).filter(oid=>
    (orders[oid].trackingIds||[]).length===0 && (labelPagesByOrder[oid]||[]).length>0
  );
  if(missingTrackingOids.length>0){
    if(opts&&opts.onTrackingOcrStart)opts.onTrackingOcrStart(file.name,missingTrackingOids.length);
    const worker=await ttGetOcrWorker();
    for(let i=0;i<missingTrackingOids.length;i++){
      const oid=missingTrackingOids[i];
      if(opts&&opts.onTrackingOcrProgress)opts.onTrackingOcrProgress(file.name,i+1,missingTrackingOids.length);
      const candidatePages=labelPagesByOrder[oid]||[];
      for(const p of candidatePages){
        trackingOcrPagesScanned++;
        try{
          const page=await pdf.getPage(p);
          const ocrLines=await ttOcrPageLines(page,worker);
          const recovered=ttExtractTrackingFromOcrLines(ocrLines);
          if(recovered){
            orders[oid].trackingIds.push(recovered);
            orders[oid].ocrParsed=true; // 화면에 🔍 OCR 배지 — 원본 대조 권장 표시 재사용
            trackingOcrRecovered++;
            break; // 이 주문 트래킹은 찾았으니 나머지 후보 페이지는 안 봐도 됨
          }
        }catch(e){
          console.log('[TT OCR-tracking] page '+p+' 실패:',e);
        }
      }
    }
  }

  // ★ v98: 배송 라벨에서 뽑은 실명 후보들을, 이미 검증된 스캔 매칭 로직(ttFindOrderByTracking)
  //   그대로 재사용해서 트래킹 번호로 해당 주문에 연결하고 buyer(닉네임)를 실명으로 교체.
  //   (In Progress 목록 등에서 TikTok 닉네임 대신 실제 이름이 보이게 되어, 작업자가
  //   여러 라벨 더미에서 물리적으로 라벨을 찾을 때 훨씬 쉬워짐)
  labelCandidates.forEach(({trackingRaw,name})=>{
    const{order:found}=ttFindOrderByTracking(trackingRaw,Object.values(orders));
    if(found)found.buyer=name;
  });
  return{orders,newOrderCount,skippedPages,totalPages:pdf.numPages,ocrUsed,ocrPagesScanned,ocrOrdersFound,trackingOcrPagesScanned,trackingOcrRecovered};
}

/* SKU Master xlsx 파일을 파싱해서 {single:[{sku,barcode}], sets:[{setSku,componentSku,qty,productName,status}]} 반환 */
function ttParseSkuXlsx(arrayBuffer){
  const wb=XLSX.read(new Uint8Array(arrayBuffer),{type:'array'});
  const clean=v=>(v||'').toString().trim();
  const single=[];
  const seenSku=new Set(); // ★ v106: 같은 업로드 안에서 Seller SKU 중복 시 먼저 들어온 쪽(Single SKU)이 우선
  const singleSheet=wb.Sheets[wb.SheetNames.find(n=>n.includes('Single'))];
  if(singleSheet){
    XLSX.utils.sheet_to_json(singleSheet,{defval:''}).forEach(r=>{
      const sku=clean(r['Seller SKU']),barcode=clean(r['Barcode']);
      if(sku&&barcode&&!seenSku.has(sku)){single.push({sku,barcode});seenSku.add(sku);}
    });
  }
  // ★ v106: "Single SKU" 시트에 없는 항목을 "WMS" 시트(로트/유통기한별 재고관리 시트,
  // A열=SKU, C열=바코드)에서 자동으로 보완해온다. WMS는 같은 SKU가 로트마다 여러 줄
  // 반복되는 구조라 헤더 행 위치를 장담할 수 없어서, 이름 기반이 아니라 "숫자로만 된
  // 8~14자리 값"인지로 바코드 열을 판별한다(헤더 텍스트 행은 이 조건에 걸리지 않아
  // 자연히 건너뛰어짐). Single SKU 시트에 이미 있는 SKU는 그대로 우선(WMS로 덮어쓰지 않음).
  const wmsSheet=wb.Sheets[wb.SheetNames.find(n=>n.includes('WMS'))];
  if(wmsSheet){
    const rows=XLSX.utils.sheet_to_json(wmsSheet,{header:1,defval:''});
    rows.forEach(r=>{
      const sku=clean(r[0]),barcode=clean(r[2]);
      if(sku&&/^\d{8,14}$/.test(barcode)&&!seenSku.has(sku)){single.push({sku,barcode});seenSku.add(sku);}
    });
  }
  const sets=[];
  const setSheet=wb.Sheets[wb.SheetNames.find(n=>n.includes('Set'))];
  if(setSheet){
    XLSX.utils.sheet_to_json(setSheet,{defval:''}).forEach(r=>{
      const setSku=clean(r['Set SKU']),compSku=clean(r['Component Seller SKU']);
      const compQty=parseInt(r['Component Qty'])||1;
      const productName=clean(r['Set Product Name']);
      const status=clean(r['Status']);
      if(setSku&&compSku)sets.push({setSku,componentSku:compSku,qty:compQty,productName,status});
    });
  }
  return{single,sets};
}

/* 주문의 required 라인(단품은 그대로, 세트는 구성품으로 전개) 계산 */
function ttComputeRequiredLines(order,skuSingleMap,skuSetMap){
  const lines=[];
  (order.items||[]).forEach(item=>{
    if(item.isSetComponent){
      lines.push({sellerSku:item.sellerSku,productName:item.productName,required:item.qty,scanned:0,barcode:skuSingleMap[item.sellerSku]||''});
      return;
    }
    const comps=skuSetMap[item.sellerSku];
    if(comps&&comps.length>0){
      comps.forEach(c=>{
        lines.push({sellerSku:c.componentSku,productName:c.productName||item.productName,required:c.qty*item.qty,scanned:0,barcode:skuSingleMap[c.componentSku]||''});
      });
    }else{
      lines.push({sellerSku:item.sellerSku,productName:item.productName,required:item.qty,scanned:0,barcode:skuSingleMap[item.sellerSku]||''});
    }
  });
  return lines;
}

// ★ v133 버그 수정: 한 주문 안에 같은 Seller SKU가 여러 줄로 들어올 수 있다
// (세트 2개가 같은 구성품을 공유하거나, 같은 상품이 별도 줄로 두 번 주문된 경우 등).
// 그런데 지금까지는 진행상황을 Object.fromEntries(lines.map(l=>[sku,scanned]))로 만들어서
// **같은 SKU가 있으면 마지막 줄의 값만 남고 앞의 줄은 통째로 사라졌다.**
// 예: A(1개 필요) 줄이 2개인 주문에서 첫 줄을 스캔해도 서버에는 {A:0}으로 저장됨.
// 그 상태에서 폴링/재접속으로 화면이 서버 값을 다시 읽으면 방금 스캔한 게 0으로 돌아간다
// (= "스캔했는데 다시 미입력 상태로 되돌아감"). 같은 상품이 반복되는 주문일수록 잘 터진다.
// → 저장할 땐 같은 SKU끼리 합산하고, 복원할 땐 그 합계를 각 줄에 차례로 나눠 담는다.
//   (SKU가 겹치지 않는 일반 주문에서는 기존 동작과 완전히 동일 — 하위호환 유지)
function ttBuildLineScanned(lines){
  const m={};
  (lines||[]).forEach(l=>{ m[l.sellerSku]=(Number(m[l.sellerSku])||0)+(Number(l.scanned)||0); });
  return m;
}
function ttApplyLineScanned(lines,saved){
  if(!saved)return;
  const pool={};
  Object.keys(saved).forEach(k=>{ pool[k]=Number(saved[k])||0; });
  (lines||[]).forEach(l=>{
    const avail=Number(pool[l.sellerSku]||0);
    const take=Math.max(0,Math.min(avail,l.required));
    l.scanned=take;
    pool[l.sellerSku]=avail-take;
  });
}

// ★ v131 추가: 서버(TT_Progress)에 저장된 진행상태가 "이 화면이 방금 보낸 결과"를 실제로
// 따라잡았는지 판정한다. v130까지는 로컬 완료 표시를 오직 "20초 타이머"로만 지켰기 때문에,
// 서버가 요청을 ok로 받아놓고도 동시 쓰기 경합으로 그 행을 덮어써서 실제로는 저장이 유실된
// 경우(= 클라이언트는 실패를 알 방법이 없음) 20초 뒤 폴링이 로컬 완료 표시를 되돌려버렸다.
// 이제는 시간이 아니라 "서버 값이 실제로 일치하는가"로 보호를 해제한다.
function ttProgressMatches(remote,expect){
  if(!expect)return true;
  if(!remote)return false;
  // ★ v132: 서버가 이미 'completed'인데 이 화면은 그 직전 'in_progress'를 기다리는 경우는
  // 서버가 더 앞서 있는 것이므로 일치로 본다. (아니면 영원히 재전송 큐를 돌게 된다)
  if(String(remote.status||'')==='completed')return true;
  if(String(remote.status||'')!==String(expect.status||''))return false;
  const a=remote.lineScanned||{},b=expect.lineScanned||{};
  for(const k of Object.keys(b)){if(Number(a[k]||0)<Number(b[k]||0))return false;}
  return true;
}

// ★ v149: OCR로 라벨에서 복구한 트래킹 번호는, 폰트 특성상 육안으로도 구분이 거의 안 되는
//   글자쌍(대문자 I ↔ 숫자 1, O ↔ 0, S ↔ 5, B ↔ 8, Z ↔ 2)을 헷갈려서 저장했을 수 있다
//   (실사례: OnTrac "1LSD96I0017D472"의 'I'를 OCR이 '1'로 잘못 읽음 — 150dpi/300dpi 둘 다
//   동일하게 틀림, 즉 해상도 문제가 아니라 이 라벨 폰트 자체의 한계). 이런 글자들을 전부
//   대표 문자 하나로 통일해서 비교하면, 실물 라벨을 정확히 스캔했을 때 저장된 값이 살짝
//   틀렸어도 같은 주문으로 인식할 수 있다.
function ttCanonicalizeAmbiguous(s){
  return String(s||'').toUpperCase()
    .replace(/[IL]/g,'1').replace(/O/g,'0').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2');
}
function ttFindOrderByTracking(rawVal,orders){
  const info=ttNormalizeBarcode(rawVal);
  // ★ v31: 라벨에 인쇄된 바코드가 Tracking Number가 아니라 Order ID인 경우도 있어서
  //   Order ID로도 매칭 시도 (스캔값이 순수 숫자면 orderId와 직접 비교)
  const rawDigits=String(rawVal||'').trim();
  const byOrderId=orders.find(o=>String(o.orderId)===rawDigits);
  if(byOrderId)return{order:byOrderId,info};
  for(const cand of info.candidates){
    const exact=orders.find(o=>(o.trackingIds||[]).includes(cand));
    if(exact)return{order:exact,info};
  }
  for(const cand of info.candidates){
    const partial=orders.find(o=>(o.trackingIds||[]).some(t=>t&&(t.includes(cand)||cand.includes(t))));
    if(partial)return{order:partial,info};
  }
  // ★ v149: 위 두 패스가 전부 실패했을 때만, 마지막 안전망으로 정규화 비교 시도
  for(const cand of info.candidates){
    const canonCand=ttCanonicalizeAmbiguous(cand);
    if(!canonCand)continue;
    const fuzzy=orders.find(o=>(o.trackingIds||[]).some(t=>t&&ttCanonicalizeAmbiguous(t)===canonCand));
    if(fuzzy)return{order:fuzzy,info};
  }
  return{order:null,info};
}

/* TT 사운드 피드백 (창고 소음 환경 대비) */
let ttAudioCtx=null;
function ttGetAudioCtx(){if(!ttAudioCtx)ttAudioCtx=new(window.AudioContext||window.webkitAudioContext)();if(ttAudioCtx.state==='suspended')ttAudioCtx.resume();return ttAudioCtx;}
['keydown','pointerdown','touchstart'].forEach(evt=>document.addEventListener(evt,()=>{try{ttGetAudioCtx();}catch(e){}},{once:true,capture:true}));
function ttBeep(freq,duration,type,volume,delay){
  try{const ctx=ttGetAudioCtx();const start=ctx.currentTime+(delay||0);const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type=type||'sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0.0001,start);
    gain.gain.exponentialRampToValueAtTime(volume!=null?volume:0.3,start+0.01);gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+duration+0.02);
  }catch(e){}
}
function ttPlayTick(){ttBeep(1000,0.05,'sine',0.22,0);}
function ttPlayError(){ttBeep(190,0.1,'sawtooth',0.4,0);ttBeep(150,0.1,'sawtooth',0.4,0.13);ttBeep(190,0.1,'sawtooth',0.4,0.26);}
function ttPlayBlocked(){ttBeep(520,0.16,'triangle',0.35,0);ttBeep(520,0.16,'triangle',0.35,0.24);}
function ttPlayWarn(){ttBeep(350,0.22,'triangle',0.3,0);}
// ★ v67: 완료 사운드를 밝은 벨 상승화음(도-미-솔)으로 교체 + "완료했습니다" 음성 안내 추가
//   (작업자들이 더 신나게 일할 수 있도록 — 기존 4음 sine 차임보다 칭찬하는 느낌으로 변경)
function ttPlayComplete(){
  [523,659,784].forEach((f,i)=>{ttBeep(f,0.42,'sine',0.3,i*0.11);ttBeep(f*2,0.42,'sine',0.1,i*0.11);});
  ttSpeakDone();
}
let ttKoVoice=null;
function ttLoadVoices(){
  try{
    const all=speechSynthesis.getVoices();
    // ★ v69: 확인 결과 이 환경엔 진짜 남성 한국어 음성이 없고, lang이 정확히 'ko-KR'이면서
    //   이름에 "대한민국"이 들어간 음성이 톤이 제일 좋았음(여성). 그 외 이상한 억양의
    //   음성들은 배제. 우선순위: ① lang==='ko-KR' & 이름에 "대한민국" 포함 → ② lang==='ko-KR'
    //   중 첫번째 → ③ lang이 'ko'로 시작하는 것 중 첫번째(최후 fallback)
    const koStrict=all.filter(v=>v.lang==='ko-KR');
    const male=all.find(v=>v.lang&&v.lang.startsWith('ko')&&/male|man\b|injoon|minsu|minho|hyunwoo|jinho|junho/i.test(v.name));
    ttKoVoice=male||koStrict.find(v=>v.name.indexOf('대한민국')>=0)||koStrict[0]||all.find(v=>v.lang&&v.lang.startsWith('ko'))||null;
  }catch(e){}
}
if(typeof speechSynthesis!=='undefined'){speechSynthesis.onvoiceschanged=ttLoadVoices;ttLoadVoices();}
function ttSpeakDone(){
  try{
    const u=new SpeechSynthesisUtterance('완료했습니다');
    u.lang='ko-KR';
    const isMale=ttKoVoice&&/male|man\b|injoon|minsu|minho|hyunwoo|jinho|junho/i.test(ttKoVoice.name);
    if(ttKoVoice)u.voice=ttKoVoice;
    // 진짜 남성 음성이 없으면(대부분의 경우) 톤 좋은 여성 음성을 골라서 피치를 확실히 낮춤
    u.pitch=isMale?1.0:0.55;
    u.rate=isMale?1.05:1.12;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ══════ PICKER SELECT ══════ */
function PickerSelect({value,onChange,pickers,dark,pkC}){
  pkC=pkC||(i=>({bg:'#E6F1FB',tx:'#1254A0'}));
  const [open,setOpen]=useState(false);
  const [pos,setPos]=useState({top:0,left:0,w:0});
  const btnRef=useRef(null);const menuRef=useRef(null);
  useEffect(()=>{
    const fn=e=>{if(btnRef.current&&!btnRef.current.contains(e.target)&&menuRef.current&&!menuRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',fn);return()=>document.removeEventListener('mousedown',fn);
  },[]);
  const open2=()=>{
    if(!open&&btnRef.current){const r=btnRef.current.getBoundingClientRect();const below=window.innerHeight-r.bottom;const menuH=Math.min(pickers.length*40+44,290);setPos({top:below>menuH?r.bottom+4:r.top-menuH-4,left:r.left,w:Math.max(r.width,180)});}
    setOpen(o=>!o);
  };
  const wc=value?pkC(value):pkC(0);const D=dark?'dark':'light';

/* ══════ CLOCK ══════ */
function Clock({dark}){
  const [t,setT]=useState(()=>new Date());
  useEffect(()=>{const id=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(id);},[]);
  const h24=t.getHours();const ampm=h24>=12?'PM':'AM';const h12=h24%12||12;
  const mm=String(t.getMinutes()).padStart(2,'0');const ss=String(t.getSeconds()).padStart(2,'0');
  const dateStr=t.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const D=dark?'dark':'light';
  return h('div',{className:'clock-row '+D},
    h('span',{className:'clock-date'},dateStr),
    h('div',{style:{display:'flex',alignItems:'baseline',gap:3}},
      h('span',{className:'clock-time '+D},h12+':'+mm),
      h('span',{className:'clock-sec'},':'+ss),
      h('span',{className:'clock-ampm'},ampm)
    )
  );
}

        // pollTT(30초 주기)가 "서버엔 아직 완료로 안 남아있네" 하고 로컬 완료 표시를 되돌려버림
        // → 작업자 눈엔 "스캔했는데 시간 지나면 없어짐"으로 보이고 또 스캔하게 됨. 오늘 가장
        // 흔한 상품(APNS11-AP, 50건+)이 하필 이 재시도 경합에 가장 자주 걸려서 두드러졌던 것.
        // 재시도가 진행되는 동안 보호 시각을 계속 갱신해서, 실제로 저장 성공(또는 영구 실패로
        // 확정)할 때까지 로컬 완료 표시가 함부로 되돌아가지 않게 한다.
        // ★ v131: 새 구조(객체)에 맞춰 ts만 갱신. 큐에만 있고 보호 등록이 없는 경우
        // (예: 새로고침 직후)엔 job.payload를 기대값으로 삼아 새로 등록한다.
        const pd=pendingTtProgressRef.current.get(orderId);
        if(pd)pd.ts=Date.now();
        else if(job.payload&&job.payload.status)ttMarkPending(orderId,job.payload);
        const r=await syncDataAwait(wh,job.action,job.payload);
        if(r&&r.ok)ttFailedSyncsRef.current.delete(orderId);
      }
      setTtFailedSyncCount(ttFailedSyncsRef.current.size);
    };
    const id=setInterval(sweep,10000);
    return()=>clearInterval(id);
  },[wh]);
  // 재시도 4회(0.7s/1.4s/2.1s 백오프) 후에도 실패하면 큐에 등록 + 작업자에게 알림
  const ttSyncWithRetry=async(action,payload,maxAttempts=4)=>{

      const r=await syncDataAwait(wh,action,payload);
      if(r&&r.ok)return r;
      lastErr=(r&&r.error)||'unknown error';

  // ★ v66 버그 수정: 라벨→상품, 상품완료→라벨 포커스 이동이 여러 군데(라벨스캔 성공,

  const pendingListPatches=useRef(new Map());

  //   하고 끝(재시도 없음)이었음. 반면 pruneStale은 로컬에서 방금(30초 이내) 만든 항목만

  //   네트워크/Apps Script가 잠깐이라도 불안정해서 upsertList가 실패하면, 화면엔 리스트가 계속
  //   보이다가 30초 뒤 다음 폴링에서 조용히 사라지고 사용자는 원인을 알 방법이 없었음

        const r=await syncDataAwait(wh,job.action,job.payload);
        if(r&&r.ok)listFailedSyncsRef.current.delete(id);
      }
      setListFailedSyncCount(listFailedSyncsRef.current.size);
    };
    const iv=setInterval(sweep,10000);
    return()=>clearInterval(iv);
  },[wh]);

  useEffect(()=>lsSet(LS.LISTS,lists),[lists]);
