  /* ══════════════════════════
     ★ v19 POLLING — 완전히 재작성
     - ver 변경 시에만 pull
     - mergeRemoteIntoLocal 사용 (dedup 없음)
     - 삭제된 항목 복원 방지
  ══════════════════════════ */
  const lastVerRef=useRef('');
  useEffect(()=>{
    if(!wh)return;
    const poll=async()=>{
      try{
        // ★ v130 버그 수정: Google Apps Script는 스크립트가 한동안 안 쓰이다 다시 깨어날 때
        // (콜드스타트) exec URL이 script.googleusercontent.com/macros/echo?...로 302
        // 리다이렉트되는데, 이 리다이렉트 응답엔 CORS 허용 헤더가 없어서 fetch()가 그냥
        // 막혀버림(주소창에 직접 치면 브라우저가 리다이렉트를 알아서 따라가서 정상으로
        // 보이지만, JS fetch는 못 따라감). 실제 배포/코드는 멀쩡한데 이 콜드스타트 순간에만
        // 재현되는 구글 인프라 특성 — 한 번 "워밍업"되면 곧바로 정상화되므로, 실패 시 바로
        // 포기하지 않고 2초 후 한 번 더 시도해서 이 흔한 케이스를 자동으로 넘긴다.
        let res,data;
        try{
          res=await fetch(wh+'?op=ver');data=await res.json();
        }catch(e1){
          await new Promise(r=>setTimeout(r,2000));
          res=await fetch(wh+'?op=ver');data=await res.json();
        }
        if(!data.ok)return;
        const newVer=String(data.ver||'');
        // ★ v93: 작업자 명단/색상/PIN 동기화를 "버전이 바뀔 때만"이 아니라 매 폴링(30초)
        //   마다 무조건 실행하도록 변경. 혹시 버전 변경 감지가 어떤 이유로든 놓치는
        //   경우에도(예: 다른 변경과 타이밍이 겹침) 이 값들은 항상 최신으로 유지되도록
        //   하기 위한 추가 안전장치 — 가벼운 조회라 매번 호출해도 부담 없음.
        syncPickerNamesRef.current();
        syncPickerColorsRef.current();
        syncManagerPinRef.current();
        // ★ 심각한 버그 수정: 새 브라우저는 lastVerRef.current가 비어있어서
        //   "버전이 바뀌었을 때만" 조건이 무조건 거짓이 되어 최초 데이터 로딩이
        //   영원히 안 일어나던 문제. → 최초 1회는 무조건 가져오도록 수정.
        if(!lastVerRef.current||newVer!==lastVerRef.current){
          const isFirstLoad=!lastVerRef.current;
          // ★ v62 버그 수정: 최초 로딩 때는 date='' (전체) 로 가져와서
          //   "완료 안 된 이전 날짜 리스트"도 이 화면에 자동으로 나타나게 함.
          //   (기존엔 오늘 날짜만 가져와서, 새 컴퓨터는 어제 미완료 항목을 영원히 못 봤음.
          //    Settings의 "Sync from Sheets" 수동 버튼을 눌러야만 겨우 보였음)
          //   이후 폴링(버전 변경 감지)은 효율을 위해 계속 오늘 날짜만 가져옴.
          const r2=await fetch(wh+'?op=getLists&date='+(isFirstLoad?'':today()));
          const d2=await r2.json();
          if(d2.ok&&d2.lists){
            // 삭제된 항목 필터링
            const fetched=d2.lists.filter(l=>{
              if((l.status||'').toLowerCase()==='deleted')return false;
              // 로컬에서 삭제 처리된 항목은 복원하지 않음
              const dStr=String(l.date||'').slice(0,10);
              if(deletedKeys.current.has(l.pgNo+'_'+dStr))return false;
              return true;
            });
            // ★ v64: fetched가 0개여도 prune은 항상 실행 — 해당 범위의 모든 항목이
            //   서버에서 사라진 경우(전부 삭제됨)도 로컬에서 정리되도록
            setLists(prev=>{
              const scope=isFirstLoad?'':today();
              const merged=mergeRemoteIntoLocal(prev,fetched,scope,pendingListPatches.current);
              const pruned=pruneStale(merged,fetched,scope,pendingListPatches.current);
              lsSet(LS.LISTS,pruned);
              return pruned;
            });
            if(fetched.length>0)setSS('↻ '+new Date().toLocaleTimeString());
          }
        }
        lastVerRef.current=newVer;
      }catch(e){console.warn('poll error',e);}
    };
    poll();
    const id=setInterval(poll,30000);
    return()=>clearInterval(id);
  },[wh]);

  /* ── TikTok CBT 데이터 폴링 (주문/SKU마스터/스캔진행) — 다른 작업자의 스캔이 실시간 반영되도록 ── */
  useEffect(()=>{
    if(!wh)return;
    const pollTT=async()=>{
      try{
        const [ro,rs,rp]=await Promise.all([
          fetch(wh+'?op=ttOrders&date='+today()).then(r=>r.json()),
          fetch(wh+'?op=ttSkuMaster').then(r=>r.json()),
          fetch(wh+'?op=ttProgress').then(r=>r.json()),
        ]);
        if(ro&&ro.ok)setTtOrders(ro.orders||[]);
        if(rs&&rs.ok){
          const singleMap={};(rs.single||[]).forEach(s=>{singleMap[s.sku]=s.barcode;});
          const setMap={};(rs.sets||[]).forEach(s=>{if(!setMap[s.setSku])setMap[s.setSku]=[];setMap[s.setSku].push(s);});
          setTtSkuSingle(singleMap);setTtSkuSet(setMap);
        }
        // ★ v97 버그 수정: 서버 poll이 항상 setTtProgress(rp.progress)로 "무조건 덮어쓰기"를 해서,
        // 작업자가 방금 마지막 제품을 스캔/수동확인해 로컬에서 completed로 바꾼 직후(=In Progress 1→0)
        // 15초 poll이 아직 저장 완료 전(in_progress)의 서버값을 읽어와 그대로 덮어써서
        // In Progress가 0→1로 되돌아갔다가, 그 다음 poll에서 다시 0으로 돌아오는("깜빡임") 문제.
        // → 메인 피킹리스트(mergeRemoteIntoLocal)와 동일하게, 방금(20초 이내) 이 화면에서
        // 로컬로 갱신한 주문은 poll 응답이 와도 로컬 값을 그대로 보호.
        // ★ v131 버그 수정 (핵심): 위 v97 보호는 "20초"라는 시간에만 의존했다. 그런데
        // 같은 상품이 들어간 주문을 여러 명이 연속으로 빠르게 스캔하면, 서버(Apps Script)가
        // 요청을 ok로 응답해놓고도 동시 쓰기 경합으로 그 행이 다른 요청에 덮여 실제 저장이
        // 유실되는 경우가 생긴다. 이때 클라이언트는 ok를 받았으니 재시도 큐에도 안 들어가고,
        // 20초가 지나면 보호가 풀려 폴링이 로컬 완료 표시를 그대로 되돌려버렸다
        // (= "스캔했는데 다시 미입력 상태로 돌아감"). v130의 sweep 갱신은 "실패를 인지한"
        // 경우만 커버했기 때문에 이 조용한 유실은 여전히 남아 있었다.
        // → 이제 보호 해제 기준을 시간이 아니라 "서버 값이 실제로 내 결과를 반영했는가"로 바꾸고,
        //   25초가 지나도 반영이 안 되면 유실로 간주해 자동으로 재전송 큐에 넣어 스스로 복구한다.
        if(rp&&rp.ok){
          const nowMs=Date.now();
          const remoteProg=rp.progress||{};
          const protectIds=[];
          pendingTtProgressRef.current.forEach((pd,oid)=>{
            if(ttProgressMatches(remoteProg[oid],pd.expect)){
              pendingTtProgressRef.current.delete(oid); // 서버가 따라잡음 → 보호 해제
              return;
            }
            protectIds.push(oid); // 아직 반영 안 됨 → 로컬 값 유지 (되돌리지 않음)
            if(nowMs-pd.ts>25000&&pd.payload&&!ttFailedSyncsRef.current.has(oid)){
              ttFailedSyncsRef.current.set(oid,{action:'ttScanUpdate',payload:pd.payload});
              pd.ts=nowMs; // 재전송 기회를 준 뒤 다시 대기
            }
          });
          setTtFailedSyncCount(ttFailedSyncsRef.current.size);
          setTtProgress(prev=>{
            const merged={...remoteProg};
            protectIds.forEach(oid=>{if(prev[oid])merged[oid]=prev[oid];});
            return merged;
          });
        }
      }catch(e){console.warn('TT poll error',e);}
    };
    pollTT();
    const id=setInterval(pollTT,15000);
    return()=>clearInterval(id);
  },[wh]);

  /* ── 페이지 기준 작업자 배정 폴링 ── */
  const deletedAssignIds=useRef(new Set());
  const pendingAssignPatches=useRef(new Map()); // id -> {patch:{...}, ts} — 서버가 따라잡을 때까지 로컬 변경(완료 처리 등) 보호
  const paFirstLoadDone=useRef(false); // ★ v130: 리스트 로딩(1270번대)과 동일한 패턴 — 최초 1회만 전체(date='')
  useEffect(()=>{
    if(!wh)return;
    const pollPA=async()=>{
      try{
        // ★ v130 버그 수정: 여기가 항상 date=today()만 요청해서, 새로고침/새 브라우저에서는
        //   어제 배정 데이터가 서버에서부터 아예 안 내려와 화면단(assignsFor) 수정만으로는
        //   해결되지 않았음. 리스트 로딩과 동일하게 최초 1회는 전체를 가져오도록 수정.
        const isFirst=!paFirstLoadDone.current;
        const r=await fetch(wh+'?op=pickAssigns&date='+(isFirst?'':today())).then(r=>r.json());
        paFirstLoadDone.current=true;
        if(r&&r.ok){
          const remote=(r.assigns||[]).filter(a=>!deletedAssignIds.current.has(a.id)).map(a=>{
            // ★ 버그 수정: "완료" 눌러도 서버가 아직 처리 전이면 폴링이 옛(미완료) 데이터로
            //   덮어써서 잠깐 되돌아갔다 나중에 다시 반영되는 현상 발생.
            //   → 로컬에서 방금 바꾼 필드는, 서버 값이 실제로 따라잡을 때까지 그대로 유지.
            const pending=pendingAssignPatches.current.get(a.id);
            if(!pending)return a;
            const confirmed=Object.entries(pending.patch).every(([k,v])=>String(a[k]||'')===String(v||''));
            if(confirmed||Date.now()-pending.ts>30000){pendingAssignPatches.current.delete(a.id);return a;}
            return {...a,...pending.patch};
          });
          setPickAssigns(prev=>{
            // ★ 방금 로컬에서 추가한 배정이 서버에 아직 반영되기 전에 폴링이 통째로
            //   덮어써서 "이름이 잠깐 사라졌다 다시 나타나는" 현상 방지.
            //   → remote에 아직 없는 로컬 항목(반영 중)은 지우지 않고 그대로 유지.
            const remoteIds=new Set(remote.map(a=>a.id));
            const pendingLocal=prev.filter(a=>!remoteIds.has(a.id)&&!deletedAssignIds.current.has(a.id));
            return [...remote,...pendingLocal];
          });
        }
      }catch(e){console.warn('pickAssigns poll error',e);}
    };
    pollPA();
    const id=setInterval(pollPA,15000);
    return()=>clearInterval(id);
  },[wh]);

  const sync=useCallback((action,payload)=>{
    if(!wh)return;
    syncData(wh,action,payload).then(()=>setSS('✓ '+new Date().toLocaleTimeString())).catch(()=>{
      setSS('⚠');
      // ★ v130: 실패한 요청을 버리지 않고 재시도 큐에 등록 (위 listFailedSyncsRef 참고)
      const id=(payload&&payload.list&&payload.list.id)||(payload&&payload.pgNo)||(action+'_'+Date.now());
      touchPending(id);
      listFailedSyncsRef.current.set(id,{action,payload});
      setListFailedSyncCount(listFailedSyncsRef.current.size);
    });
  },[wh]);

  /* mutations */
  const upd=(id,ch)=>{touchPending(id);setLists(p=>p.map(l=>{if(l.id!==id)return l;const u={...l,...ch};sync('upsertList',{list:u});return u;}));};
  // ★ v130 추가: endPickAssignFn의 doneSum 날짜조건 버그로 이미 갇혀버린 과거 리스트들
  // (모든 피커가 체크됐는데도 Pick End가 영원히 안 찍힌 경우)를 화면 로드/데이터 갱신 시마다
  // 스스로 재검사해서 뒤늦게라도 복구. upd()가 pickEnd를 채우고 나면 조건(!l.pickEnd)이
  // 꺼지므로 반복 실행되지 않음(자연 종료).
  useEffect(()=>{
    if(lists.length===0||pickAssigns.length===0)return;
    lists.forEach(l=>{
      if(l.pickEnd||!(l.pages>0))return;
      const doneSum=pickAssigns.filter(x=>x.pgNo===l.pgNo&&x.pickEnd).reduce((s,x)=>s+(x.pages||0),0);
      if(doneSum>=l.pages)upd(l.id,{pickEnd:ts()});
    });
  },[lists,pickAssigns]);
  const setWrk=(id,n)=>upd(id,{worker:n});
  const startPick=id=>{
    const l=lists.find(x=>x.id===id);if(!l)return;
    if(!l.worker){alert('Please assign a picker first before starting.');return;}
    if(!l.pickStart)upd(id,{pickStart:ts()});
  };
  const endPick=id=>{const l=lists.find(x=>x.id===id);if(l&&l.pickStart&&!l.pickEnd)upd(id,{pickEnd:ts()});};
  const startScan=id=>{const l=lists.find(x=>x.id===id);if(l&&!l.scanStart)upd(id,{scanStart:ts()});};
  const endScan=id=>{
    const l=lists.find(x=>x.id===id);
    if(!l||!l.pickEnd||l.scanEnd)return;
    const oc=l.orderCount||0;
    // ★ v80 버그 수정: scanned>=orderCount("다 스캔된 것처럼 보임")이면 단순 confirm창만
    //   띄우고 바로 끝내던 지름길을 제거함. ShipStation 자동카운트가 이 리스트와 무관한
    //   다른 주문들까지 끌어와서 부풀려질 수 있다는 게 실제로 확인됐기 때문에(26건인데
    //   99건으로 표시), 아무리 숫자가 넘쳐도 항상 사람이 직접 최종 수량을 확인/수정하는
    //   상세 모달을 거치도록 통일. (모달 열릴 때 입력값은 총 주문수를 넘지 않게 표시)
    const cappedScanned=Math.min(l.scanned||0,oc);
    const missed=oc-cappedScanned;
    setScanInput(cappedScanned);
    setSkipQtys({OOS:0,'NF (Not Found)':0,'EXP (Expiry Issue)':0,'Customer Cancel':0});
    setEndScanModal({id,pgNo:l.pgNo,scanned:l.scanned,oc,missed});
  };
  const addN=(id,q)=>{touchPending(id);setLists(prev=>prev.map(l=>{
    if(l.id!==id)return l;const now=ts();const oc=l.orderCount||0;const nc=(l.scanned||0)+q;
    const ch={scanned:nc};if(!l.scanStart)ch.scanStart=now;if(nc>=oc&&oc>0&&!l.scanEnd)ch.scanEnd=now;
    const u={...l,...ch};sync('upsertList',{list:u});return u;
  }));};

  /* scan barcode */
  const handleScan=e=>{
    if(e.key!=='Enter')return;const b=scanIn.trim();if(!b)return;setSI('');
    const d=detect(b);
    if(!d){setSE('Unrecognized: '+b);setLS(null);ttPlayError();ttShowBigAlert('❓','UNKNOWN','인식할 수 없는 바코드: '+b,'err');return;}
    setSE('');const now=ts();const td=today();
    const tgt=lists.find(l=>l.category===d.cat&&l.date===td&&l.scanned<(l.orderCount||0));
    if(!tgt){setSE(d.cat+' — No active pick list');setLS({barcode:b,cat:d.cat,store:d.store,time:fmtT(now),ok:false});ttPlayWarn();ttShowBigAlert('⚠️','NO ACTIVE LIST',d.cat+' — 진행중인 픽리스트 없음','warn');return;}
    let willComplete=false;
    touchPending(tgt.id);
    setLists(prev=>prev.map(l=>{
      if(l.id!==tgt.id)return l;const nc=l.scanned+1;const oc=l.orderCount||0;const ch={scanned:nc};
      if(!l.scanStart)ch.scanStart=now;if(nc>=oc&&oc>0&&!l.scanEnd){ch.scanEnd=now;willComplete=true;}
      const u={...l,...ch};sync('upsertList',{list:u});return u;
    }));
    const entry={barcode:b,cat:d.cat,store:d.store,time:fmtT(now),pgNo:tgt.pgNo,worker:tgt.worker||''};
    setLS({...entry,ok:true});setLog(prev=>[entry,...prev.slice(0,499)]);sync('addScanLog',{entry});
    if(willComplete){ttPlayComplete();ttShowBigAlert('✅','LIST COMPLETE',tgt.pgNo+' ('+d.cat+') 스캔 완료!','ok',1600);}
    else{ttPlayTick();}
  };

  /* ══════════════════════════════════════════
     TikTok CBT — 레이블 PDF / SKU 마스터 업로드 (매니저, 매일 아침 1회)
  ══════════════════════════════════════════ */
  const ttShowBigAlert=(icon,msg,sub,type,duration)=>{
    clearTimeout(ttBigAlertTimer.current);
    setTtBigAlert({icon,msg,sub,type});
    ttBigAlertTimer.current=setTimeout(()=>setTtBigAlert(null),duration||1800);
  };
  const ttShowToast=(msg,sub,duration)=>{
    clearTimeout(ttToastTimer.current);
    setTtToast({msg,sub,key:Date.now()});
    ttToastTimer.current=setTimeout(()=>setTtToast(null),duration||1000);
  };

  const ttUploadLabelFiles=async(fileList)=>{
    if(!wh){setTtUploadMsg('⚠ Google Sheets URL을 먼저 설정하세요 (Settings)');return;}
    const files=Array.from(fileList||[]);if(!files.length)return;
    setTtUploading(true);setTtUploadMsg('분석 중… ('+files.length+'개 파일)');
    let ordersAcc={};
    // ★ v144: 파일이 이미지형(OCR 필요)으로 판정되면 ttParsePdfFile이 이 콜백들을 호출해서
    //   진행상황을 화면에 보여줌 — OCR은 페이지당 1~수 초가 걸려서, 진행 표시 없이 그냥
    //   멈춰 있으면 매니저가 "멈췄나?" 하고 새로고침해버릴 위험이 있음(v142 대량완료처리
    //   타임아웃/진행률 표시와 같은 이유).
    let ocrSummary=[]; // {fileName, pagesScanned, ordersFound}
    let trackingOcrSummary=[]; // ★ v145: {fileName, pagesScanned, recovered}
    const ocrOpts={
      onOcrStart:(fileName,pageCount)=>{
        setTtUploadMsg('🔍 '+fileName+' — 이미지형 라벨 PDF로 감지됨, OCR로 재인식 중… (0/'+pageCount+'페이지)');
      },
      onOcrProgress:(fileName,i,total)=>{
        setTtUploadMsg('🔍 '+fileName+' — OCR 인식 중… ('+i+'/'+total+'페이지)');
      },
      // ★ v145: 패킹슬립 자체엔 트래킹이 비어있고 앞장 라벨(이미지)에만 찍혀있는 주문 전용 —
      //   파일 전체가 이미지형이 아니어도(위 onOcrStart와 무관하게) 이 콜백은 따로 뜰 수 있음.
      onTrackingOcrStart:(fileName,orderCount)=>{
        setTtUploadMsg('🔍 '+fileName+' — 트래킹 번호가 비어있는 주문 '+orderCount+'건, 라벨에서 재인식 중… (0/'+orderCount+')');
      },
      onTrackingOcrProgress:(fileName,i,total)=>{
        setTtUploadMsg('🔍 '+fileName+' — 트래킹 재인식 중… ('+i+'/'+total+')');
      }
    };
    for(const file of files){
      try{
        const r=await ttParsePdfFile(file,ordersAcc,ocrOpts);
        ordersAcc=r.orders;
        if(r.ocrUsed)ocrSummary.push({fileName:file.name,pagesScanned:r.ocrPagesScanned,ordersFound:r.ocrOrdersFound});
        if(r.trackingOcrPagesScanned>0)trackingOcrSummary.push({fileName:file.name,pagesScanned:r.trackingOcrPagesScanned,recovered:r.trackingOcrRecovered});
      }
      catch(err){ setTtUploadMsg('⚠ '+file.name+' 파싱 실패: '+err.message); }
    }
    await ttReleaseOcrWorker(); // ★ v144: OCR 워커(엔진+언어데이터)는 무겁기 때문에, 업로드 세션이 끝나면 정리
    const orderList=Object.values(ordersAcc);
    if(orderList.length===0){setTtUploading(false);setTtUploadMsg('⚠ 인식된 주문이 없습니다. 패킹슬립이 포함된 PDF인지 확인하세요.');return;}
    // ★ v108 버그 수정: 870건 전체를 한 요청으로 통째로 보내다가 네트워크 지연/일시적 서버
    // 응답 지연으로 "Failed to fetch"가 뜨면 업로드 전체가 실패해버렸음(재시도도 없었음).
    // → 작은 묶음으로 나눠 순차 전송하고, 묶음 하나가 실패하면 그 묶음만 최대 3회 자동
    // 재시도. 일부만 실패해도 나머지는 이미 서버에 반영되고, 어느 만큼 실패했는지 알려줌.
    const CHUNK_SIZE=150;
    const chunks=[];
    for(let i=0;i<orderList.length;i+=CHUNK_SIZE)chunks.push(orderList.slice(i,i+CHUNK_SIZE));
    let totalAdded=0,totalMerged=0,failedChunks=0,doneCount=0;
    for(const chunk of chunks){
      setTtUploadMsg('서버 업로드 중… ('+doneCount+'/'+orderList.length+'건)');
      let res=null;
      for(let attempt=0;attempt<3;attempt++){
        res=await syncDataAwait(wh,'ttUploadOrders',{orders:chunk,date:today()});
        if(res&&res.ok)break;
        if(attempt<2)await new Promise(r=>setTimeout(r,1500)); // 재시도 전 잠깐 대기
      }
      if(res&&res.ok){totalAdded+=res.added;totalMerged+=res.merged;}
      else{failedChunks++;}
      doneCount+=chunk.length;
    }
    setTtUploading(false);
    // ★ v144: OCR 폴백이 실제로 쓰였으면 몇 건이나 OCR로 새로 찾아냈는지 요약해서 같이 보여줌
    //   (매니저가 "왜 갑자기 평소보다 시간이 오래 걸렸지"라는 의문 없이 바로 이해할 수 있게).
    const ocrNote=ocrSummary.length
      ?' — 🔍 '+ocrSummary.map(s=>s.fileName+'(이미지형, OCR로 '+s.ordersFound+'건 추가 인식)').join(', ')+'. OCR로 인식된 주문은 목록에 🔍 표시가 붙으며, 문자 인식 특성상 라벨 원본과 한 번 대조해보시길 권장합니다.'
      :'';
    // ★ v145: 패킹슬립엔 트래킹이 비어있고 라벨에서만 복구한 건수 요약
    const trackingOcrNote=trackingOcrSummary.length
      ?' — 🏷️ '+trackingOcrSummary.map(s=>s.fileName+'(트래킹 공란 주문 '+s.recovered+'/'+s.pagesScanned+'건, 라벨에서 복구)').join(', ')+'. 복구된 트래킹은 OCR 특성상 스캔이 한 번에 안 맞을 수 있으니, 안 맞으면 Order ID로 다시 시도해보세요.'
      :'';
    if(failedChunks===0){
      setTtUploadMsg('✓ 주문 '+orderList.length+'건 업로드 완료 (신규 '+totalAdded+', 병합 '+totalMerged+')'+ocrNote+trackingOcrNote);
      setTtCbtCount(orderList.length);lsSet('tt_cbt_count',orderList.length);
      // 즉시 화면 반영을 위해 로컬 상태도 업데이트 (다음 폴링에서 서버값으로 재확인됨)
      setTtOrders(prev=>{
        const map={};prev.forEach(o=>map[o.orderId]=o);
        orderList.forEach(o=>map[o.orderId]=o);
        return Object.values(map);
      });
    }else{
      setTtUploadMsg('⚠ 일부 저장 실패 ('+failedChunks+'/'+chunks.length+'묶음, 각 3회 재시도 후에도 실패) — 신규 '+totalAdded+', 병합 '+totalMerged+'건은 이미 반영됨. 잠시 후 다시 업로드하면 나머지가 재시도됩니다.');
    }
  };

  const [ttSkuUploadMsg,setTtSkuUploadMsg]=useState(''); // ★ v107: SKU Master 업로드 결과 전용 (레이블 업로드 메시지와 분리)
  const ttUploadSkuFile=async(file)=>{
    if(!file)return;
    if(!wh){setTtSkuUploadMsg('⚠ Google Sheets URL을 먼저 설정하세요 (Settings)');return;}
    setTtUploading(true);setTtSkuUploadMsg('SKU Master 분석 중…');
    try{
      const buf=await file.arrayBuffer();
      const{single,sets}=ttParseSkuXlsx(buf);
      const res=await syncDataAwait(wh,'ttUploadSkuMaster',{single,sets});
      setTtUploading(false);
      if(res&&res.ok){
        setTtSkuUploadMsg('✓ SKU Master 업로드 완료 — 단품 '+res.addedSingle+'개, 세트 '+res.addedSet+'개 신규 추가 (기존 데이터 유지)');
      }else{
        setTtSkuUploadMsg('⚠ 서버 저장 실패: '+((res&&res.error)||'unknown'));
      }
    }catch(err){setTtUploading(false);setTtSkuUploadMsg('⚠ 파싱 실패: '+err.message);}
  };

  /* ── 1단계: 라벨(Tracking) 스캔 ── */
  const ttHandleLabelScan=e=>{
    if(e.key!=='Enter')return;const val=(ttLabelIn||'').trim();setTtLabelIn('');if(!val)return;
    const{order,info}=ttFindOrderByTracking(val,ttOrders);
    if(!order){ttPlayError();ttShowBigAlert('❌','NOT FOUND',val,'err');setTtAlert({msg:'❌ 매칭되는 주문을 찾을 수 없습니다: '+val,type:'err'});return;}
    const prog=ttProgress[order.orderId];
    if(prog&&prog.status==='completed'){ttPlayBlocked();ttShowBigAlert('⛔','이미 완료됨','주문 #'+order.orderId,'warn');setTtAlert({msg:'⛔ 이미 완료 처리된 주문입니다 — 재검수 차단 (#'+order.orderId+')',type:'err'});return;}
    const lines=ttComputeRequiredLines(order,ttSkuSingle,ttSkuSet);
    if(prog&&prog.lineScanned)ttApplyLineScanned(lines,prog.lineScanned); // ★ v133: 중복 SKU 분배
    const scannedTrackingIds=new Set(prog?prog.scannedTrackingIds||[]:[]);
    scannedTrackingIds.add(info.normalized||val);
    setTtCurrentOrder({orderId:order.orderId,trackingIds:order.trackingIds||[],scannedTrackingIds,buyer:order.buyer,lines});
    setTtAlert(null);
    ttPlayTick(); // ★ 라벨 스캔 성공 시에도 소리 — 지금까진 2단계(상품 스캔)만 소리가 났음
  };
  // ★ v112: Pending/In Progress 목록에서 트래킹 번호를 몰라도(또는 여러 건을 훑어볼 때)
  // 바로 클릭해서 그 주문을 열 수 있게 함 — 라벨 스캔과 동일한 로직, 다만 이미 order
  // 객체를 알고 있으므로 트래킹 검색 없이 바로 연다.
  const ttOpenOrderDirect=order=>{
    if(!order)return;
    if(!ttWorker){setTtAlert({msg:'⚠ 먼저 스캔 작업자를 선택하세요',type:'warn'});return;}
    const prog=ttProgress[order.orderId];
    if(prog&&prog.status==='completed'){ttPlayBlocked();ttShowBigAlert('⛔','이미 완료됨','주문 #'+order.orderId,'warn');setTtAlert({msg:'⛔ 이미 완료 처리된 주문입니다 — 재검수 차단 (#'+order.orderId+')',type:'err'});return;}
    const lines=ttComputeRequiredLines(order,ttSkuSingle,ttSkuSet);
    if(prog&&prog.lineScanned)ttApplyLineScanned(lines,prog.lineScanned); // ★ v133: 중복 SKU 분배
    const scannedTrackingIds=new Set(prog?prog.scannedTrackingIds||[]:[]);
    setTtCurrentOrder({orderId:order.orderId,trackingIds:order.trackingIds||[],scannedTrackingIds,buyer:order.buyer,lines});
    setTtAlert(null);setTtStatusView(null);
    ttPlayTick();
  };

  /* ── 2단계: 상품 바코드 스캔 ── */
  /* ── 수동 확인 (바코드 불일치 등, 제품은 맞지만 등록된 바코드와 다를 때) ── */
  // ★ v139 버그 수정 (치명적): 같은 Seller SKU가 두 줄 이상 있는 주문(예: 라벨 중복 인쇄로
  // 아직 병합 전인 주문, 또는 정상적으로 같은 부품이 다른 세트에 또 쓰이는 경우)에서
  // Manual 버튼을 누르면, 실제로 클릭한 줄이 아니라 "그 SKU로 처음 찾아지는 줄"에
  // 수량이 잘못 적용되고 있었다 — openManualVerify(line)이 줄 객체만 저장하고,
  // submitManualVerify가 그 객체의 sellerSku로 다시 lines.findIndex(...)해서 위치를
  // "다시 찾다 보니" 첫 번째로 일치하는 줄(이미 완료된 줄일 수도 있음)을 가리켜버렸다.
  // 실사례: 3번째 줄(0/1 Pending)에서 Manual을 눌렀는데 1번째 줄(이미 1/1 Done)이
  // 2/1로 바뀌고 정작 3번째 줄은 그대로 0/1로 남음.
  // → 클릭한 줄의 "인덱스"를 그 자리에서 바로 기억해서, 나중에 이름으로 다시 찾지 않고
  //   그 인덱스를 그대로 사용한다.
  const openManualVerify=(line,lineIdx)=>{
    const remain=Math.max(0,line.required-line.scanned);
    setTtManualFor(line);setTtManualLineIdx(lineIdx);setTtManualQty(remain>0?remain:1);setTtManualReason('');
  };
  const submitManualVerify=()=>{
    if(!ttManualFor||!ttManualReason.trim()||!(+ttManualQty>0)||!ttCurrentOrder)return;
    const qty=Math.min(+ttManualQty,ttManualFor.required-ttManualFor.scanned);
    if(qty<=0){setTtManualFor(null);setTtManualLineIdx(null);return;}
    // ★ v139: 이름(SKU) 재검색 대신, 열 때 기억해둔 정확한 인덱스를 그대로 사용.
    //   혹시 인덱스가 어긋난 상황(줄 순서가 그 사이 바뀐 등)이면 안전하게 SKU 검색으로 폴백.
    let lineIdx=ttManualLineIdx;
    if(lineIdx==null||lineIdx<0||lineIdx>=ttCurrentOrder.lines.length||ttCurrentOrder.lines[lineIdx].sellerSku!==ttManualFor.sellerSku){
      lineIdx=ttCurrentOrder.lines.findIndex(l=>l.sellerSku===ttManualFor.sellerSku);
    }
    if(lineIdx<0)return;
    const updated={...ttCurrentOrder,lines:ttCurrentOrder.lines.map((l,i)=>i===lineIdx?{...l,scanned:l.scanned+qty,manualQty:(l.manualQty||0)+qty}:l)};
    setTtCurrentOrder(updated);
    ttLogManualVerify(updated.orderId,ttManualFor.sellerSku,ttManualFor.productName,qty,ttManualReason.trim());
    const lineScanned=ttBuildLineScanned(updated.lines); // ★ v133: 중복 SKU 합산
    const allDone=updated.lines.every(l=>l.scanned>=l.required);
    ttPlayTick();
    setTtAlert({msg:'⚠️ 수동 확인 처리됨: '+ttManualFor.productName+' × '+qty,type:'warn'});
    if(allDone){
      ttPlayComplete();ttShowToast('✅ 주문 #'+updated.orderId+' 검수 완료',updated.lines.length+'개 제품 스캔됨 (수동 확인 포함)',1000);
      const payload={orderId:updated.orderId,lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),status:'completed',worker:ttWorker};
      ttMarkPending(updated.orderId,payload); // ★ v131
      setTtProgress(p=>({...p,[updated.orderId]:{status:'completed',lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),completedBy:ttWorker,completedTime:ts()}}));
      setTimeout(()=>{setTtCurrentOrder(null);},400); // v96: focus - useEffect(ttCurrentOrder) handles it
      ttSyncWithRetry('ttScanUpdate',payload).then(r=>{if(!r.ok)ttHandleSyncFailure(updated.orderId,'ttScanUpdate',payload);});
    }else{
      const payload={orderId:updated.orderId,lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),status:'in_progress',worker:ttWorker};
      ttMarkPending(updated.orderId,payload); // ★ v131
      setTtProgress(p=>({...p,[updated.orderId]:{status:'in_progress',lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds)}}));
      ttSyncWithRetry('ttScanUpdate',payload).then(r=>{if(!r.ok)ttHandleSyncFailure(updated.orderId,'ttScanUpdate',payload);});
    }
    setTtManualFor(null);setTtManualLineIdx(null);setTtManualReason('');
  };
  // ★ v141 신규: 일괄 완료 처리 — Pending 목록 전체를 한 번에 완료 처리.
  // 시스템 장애(파싱 버그 등)로 스캔이 막혀 있는 동안, 작업자가 육안으로 실물을 확인하고
  // 이미 출고까지 마친 상황에서 100건 넘는 주문을 하나하나 클릭+사유입력 하는 건 비효율적
  // 이고 그 자체로 실수(빠뜨림, 잘못 누름)를 유발할 수 있음. 다만 "실물 없이 완료 처리"할
  // 수 있는 강력한 기능이라 안전장치를 반드시 둔다: 매니저 전용, 처리 건수를 보여주고
  // 재확인, 사유 필수 입력, 기존 수동확인과 동일하게 감사 로그(ttManualVerify)에 남김.
  const [ttBulkConfirm,setTtBulkConfirm]=useState(null); // {rows, reason} — 확인 모달 상태
  const [ttBulkRunning,setTtBulkRunning]=useState(false);
  const [ttBulkProgress,setTtBulkProgress]=useState(null); // ★ v142: {done,total} — 진행 상황 표시용
  const ttBulkForceComplete=async()=>{
    if(!ttBulkConfirm||!ttBulkConfirm.reason.trim())return;
    const rows=ttBulkConfirm.rows;
    setTtBulkRunning(true);
    setTtBulkProgress({done:0,total:rows.length}); // ★ v142
    let done=0,fail=0;
    for(const o of rows){
      try{
        const lines=ttComputeRequiredLines(o,ttSkuSingle,ttSkuSet);
        const lineScanned={};
        lines.forEach(l=>{lineScanned[l.sellerSku]=l.required;}); // 실물 육안 확인 → 필요수량 그대로 인정
        ttLogManualVerify(o.orderId,'(일괄처리)','일괄 완료 처리 — 실물 출고 확인됨',lines.length,ttBulkConfirm.reason.trim());
        const payload={orderId:o.orderId,lineScanned,scannedTrackingIds:o.trackingIds||[],status:'completed',worker:ttWorker||'Manager'};
        ttMarkPending(o.orderId,payload); // ★ v131
        setTtProgress(p=>({...p,[o.orderId]:{status:'completed',lineScanned,scannedTrackingIds:o.trackingIds||[],completedBy:ttWorker||'Manager',completedTime:ts()}}));
        // ★ v143 성능 개선: 대량 처리 중에는 서버에 skipSummary:true를 같이 보내서,
        //   완료 건마다 하루 전체 요약을 다시 계산하지 않도록 한다(건당 6~7초 지연의
        //   주원인이었음). 요약은 루프가 다 끝난 뒤 딱 한 번만 재계산한다.
        //   ttMarkPending에 저장하는 payload는 서버 응답과 비교(expect)하는 용도라
        //   그대로 두고, 실제 전송에만 skipSummary를 덧붙인다.
        // ★ v142: 무한 대기 방지 — 8초 안에 응답 없으면 실패로 간주하고 재시도 큐로 넘긴 뒤
        //   바로 다음 항목으로 진행한다(전체가 한 건 때문에 멈추지 않도록).
        const r=await syncDataAwaitTimeout(wh,'ttScanUpdate',{...payload,skipSummary:true},8000);
        if(r&&r.ok)done++;else{fail++;ttHandleSyncFailure(o.orderId,'ttScanUpdate',payload);}
      }catch(e){fail++;}
      setTtBulkProgress(p=>({done:(p?p.done:0)+1,total:rows.length})); // ★ v142: 매 건마다 진행률 갱신
    }
    // ★ v143: 건너뛰었던 DailySummary 재계산을 마지막에 한 번만 실행해서 마무리
    try{ await syncDataAwaitTimeout(wh,'refreshDailySummary',{date:today()},15000); }catch(e){}
    setTtBulkRunning(false);setTtBulkConfirm(null);setTtStatusView(null);setTtBulkProgress(null);
    ttShowToast('✅ 일괄 완료 처리됨',done+'건 완료'+(fail>0?(', '+fail+'건 실패(재시도 큐로 이동)'):''),1800);
  };

  const ttLogManualVerify=(orderId,sellerSku,productName,qty,reason)=>{
    syncDataAwait(wh,'ttManualVerify',{orderId,sellerSku,productName,qty,worker:ttWorker,reason});
  };
  // ★ v111: 레이블 파싱 오류로 제품 정보가 0개인 주문(v99 안전장치로 취소만 가능했던 케이스)을
  // 실물이 이미 출고 확인된 경우 강제로 완료 처리할 수 있게 함. 감사 로그(ttManualVerify)에
  // 사유를 남겨서 나중에 어떤 주문이 이렇게 처리됐는지 추적 가능.
  const ttForceCompleteEmptyOrder=()=>{
    if(!ttCurrentOrder||ttCurrentOrder.lines.length>0)return;
    const orderId=ttCurrentOrder.orderId;
    ttLogManualVerify(orderId,'(제품정보없음)','레이블 파싱 오류로 제품정보 없음',0,'실물 출고 확인 후 강제 완료 처리');
    const payload={orderId,lineScanned:{},scannedTrackingIds:Array.from(ttCurrentOrder.scannedTrackingIds),status:'completed',worker:ttWorker};
    ttMarkPending(orderId,payload); // ★ v131
    setTtProgress(p=>({...p,[orderId]:{status:'completed',lineScanned:{},scannedTrackingIds:Array.from(ttCurrentOrder.scannedTrackingIds),completedBy:ttWorker,completedTime:ts()}}));
    ttPlayComplete();ttShowToast('✅ 주문 #'+orderId+' 강제 완료 처리됨','제품 정보 없이 수동 완료 (실물 출고 확인됨)',1200);
    setTtCurrentOrder(null);
    ttSyncWithRetry('ttScanUpdate',payload).then(r=>{if(!r.ok)ttHandleSyncFailure(orderId,'ttScanUpdate',payload);});
  };

  // ★ v137 신규: 레이블 PDF 파싱 버그(중복 SKU 등)로 잘못 쪼개진 주문을 관리자가
  // Settings에서 재업로드해 바로잡으면, "필요 수량"은 줄어들어(예: 2줄→1줄) 이미 스캔한
  // 기록만으로 전부 충족되는 경우가 많다. 그런데 지금까지는 이 경우를 감지해서
  // 완료(completed)로 넘겨주는 경로가 코드에 아예 없었다 — 다시 스캔을 시도하면
  // ttHandleItemScan이 "이미 필요 수량만큼 스캔됨(초과 스캔)" 경고만 띄우고 끝나버려서,
  // 데이터는 다 맞는데 상태만 영원히 in_progress로 남아있는 문제가 있었다
  // (실사례: 재파싱 버그 수정 후 재업로드해도 In Progress 목록 숫자가 전혀 안 줄어듦).
  // → 주문을 열었을 때 모든 라인이 이미 required를 충족한 상태면, 수동 확인 버튼과 같은
  // 자리에 "완료 처리" 버튼을 보여주고, 누르면 ttHandleItemScan의 완료 로직과 동일하게
  // 서버에 completed로 기록한다.
  const ttForceCompleteSatisfiedOrder=()=>{
    if(!ttCurrentOrder||ttCurrentOrder.lines.length===0)return;
    if(!ttCurrentOrder.lines.every(l=>l.scanned>=l.required))return;
    const updated=ttCurrentOrder;
    const orderId=updated.orderId;
    const lineScanned=ttBuildLineScanned(updated.lines);
    ttPlayComplete();ttShowToast('✅ 주문 #'+orderId+' 검수 완료','레이블 재파싱으로 필요 수량 충족 확인됨',1200);
    setTtAlert({msg:'✅ 주문 #'+orderId+' 검수 완료! (재파싱 후 이미 충족됨)',type:'ok'});
    const payload={orderId,lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),status:'completed',worker:ttWorker};
    ttMarkPending(orderId,payload); // ★ v131
    setTtProgress(p=>({...p,[orderId]:{status:'completed',lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),completedBy:ttWorker,completedTime:ts()}}));
    setTimeout(()=>{setTtCurrentOrder(null);},400);
    ttSyncWithRetry('ttScanUpdate',payload).then(r=>{if(!r.ok)ttHandleSyncFailure(orderId,'ttScanUpdate',payload);});
  };

  const ttHandleItemScan=e=>{
    if(e.key!=='Enter')return;const val=(ttItemIn||'').trim();setTtItemIn('');if(!val||!ttCurrentOrder)return;
    const info=ttNormalizeBarcode(val);
    let matchLine=null;
    for(const cand of info.candidates){
      matchLine=ttCurrentOrder.lines.find(l=>l.barcode&&l.barcode===cand);
      if(matchLine)break;
    }
    if(!matchLine){
      ttPlayError();ttShowBigAlert('❓','UNKNOWN','바코드: '+val,'err',1200);
      setTtAlert({msg:'❓ 등록되지 않은 바코드입니다: '+val,type:'err'});
      // ★ v89 버그 수정: 여기서 그냥 에러만 띄우고 끝나서, 등록된 바코드가 아닌 실제
      //   제품(포장이 상해서 바코드가 안 읽히는 경우 등)을 처리할 방법이 없어 스캔이
      //   막혀버리던 문제. 아직 다 안 채워진 제품 라인으로 자동 안내:
      //   - 라인이 1개만 남았으면 → 바로 Manual Verify 모달을 열어줌 (사유 자동 채움)
      //   - 여러 개 남았으면 → 어떤 제품인지 먼저 고르는 선택창을 띄움
      const remainLines=ttCurrentOrder.lines.filter(l=>l.scanned<l.required);
      if(remainLines.length===1){
        openManualVerify(remainLines[0],ttCurrentOrder.lines.indexOf(remainLines[0])); // ★ v139: 원본 배열 기준 인덱스
        setTtManualReason('바코드 인식 불가 ('+val+')');
      }else if(remainLines.length>1){
        setTtPickLineBarcode(val);
      }
      return;
    }
    if(matchLine.scanned>=matchLine.required){ttPlayWarn();ttShowBigAlert('⚠️','초과 스캔',matchLine.productName,'warn');setTtAlert({msg:'⚠️ 이미 필요 수량만큼 스캔되었습니다: '+matchLine.productName,type:'warn'});return;}
    matchLine.scanned+=1;
    const updated={...ttCurrentOrder,lines:[...ttCurrentOrder.lines]};
    setTtCurrentOrder(updated);
    const lineScanned=ttBuildLineScanned(updated.lines); // ★ v133: 중복 SKU 합산
    const allDone=updated.lines.every(l=>l.scanned>=l.required);
    if(allDone){
      ttPlayComplete();ttShowToast('✅ 주문 #'+updated.orderId+' 검수 완료',updated.lines.length+'개 제품 스캔됨',1000);
      setTtAlert({msg:'✅ 주문 #'+updated.orderId+' 검수 완료!',type:'ok'});
      // ★ v116: 결과를 확인 안 하고 그냥 보내기만 하던 것 → 재시도(최대 4회) 후에도 실패하면
      //   ttHandleSyncFailure로 큐에 등록 + 작업자에게 알림(3~4명 동시 스캔 시 락 대기/네트워크
      //   순간 장애로 저장이 실패해도 조용히 묻히지 않도록).
      const payload={orderId:updated.orderId,lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),status:'completed',worker:ttWorker};
      ttMarkPending(updated.orderId,payload); // ★ v131
      setTtProgress(p=>({...p,[updated.orderId]:{status:'completed',lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),completedBy:ttWorker,completedTime:ts()}}));
      setTimeout(()=>{setTtCurrentOrder(null);},400); // v96: focus - useEffect(ttCurrentOrder) handles it
      ttSyncWithRetry('ttScanUpdate',payload).then(r=>{if(!r.ok)ttHandleSyncFailure(updated.orderId,'ttScanUpdate',payload);});
    }else{
      ttPlayTick();
      setTtAlert({msg:'✅ '+matchLine.productName+' — '+matchLine.scanned+'/'+matchLine.required,type:'ok'});
      const payload={orderId:updated.orderId,lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds),status:'in_progress',worker:ttWorker};
      ttMarkPending(updated.orderId,payload); // ★ v131
      setTtProgress(p=>({...p,[updated.orderId]:{status:'in_progress',lineScanned,scannedTrackingIds:Array.from(updated.scannedTrackingIds)}}));
      ttSyncWithRetry('ttScanUpdate',payload).then(r=>{if(!r.ok)ttHandleSyncFailure(updated.orderId,'ttScanUpdate',payload);});
    }
  };

  /* ══════════════════════════════════════════
     페이지 기준 다중 작업자 배정 (Records → Add Picker)
  ══════════════════════════════════════════ */
  // ★ v130 버그 수정: 날짜가 바뀌면(자정 경과) 어제 배정한 작업자들이 date!==today()라서
  // 전부 걸러져 PICKERS 칸이 빈 채로 보이던 문제. pgNo는 순차 발급되어 재사용되지 않는
  // 유일값이므로(v113에서 이미 검증된 원칙) date 조건 없이 pgNo만으로 매칭.
  const assignsFor=pgNo=>pickAssigns.filter(a=>a.pgNo===pgNo);
  // ★ 다음 작업자가 자동으로 이어받을 시작 페이지 (기존 배정들의 최대 종료 페이지+1)
  const nextStartPage=pgNo=>{
    const list=assignsFor(pgNo);
    if(list.length===0)return 1;
    return Math.max(...list.map(a=>a.pageEnd||0))+1;
  };

          h('div',{style:{fontWeight:700,fontSize:16,marginBottom:2,color:'#B45309'}},'⚡ 전체 일괄 완료 처리'),
          h('div',{style:{padding:'10px 14px',background:'#FFF6E8',border:'1px solid #F5C070',borderRadius:8,fontSize:12,color:'#7A3A00',margin:'14px 0',lineHeight:1.6}},
            '⚠ 스캔 없이 ',h('b',null,ttBulkConfirm.rows.length+'건'),'을 전부 완료 처리합니다. 실물을 이미 육안으로 확인하고 출고까지 끝낸 경우에만 사용하세요. 이 처리는 사유와 함께 감사 기록에 남습니다.'
          ),
          h('label',{style:{display:'block',fontSize:11,fontWeight:700,color:'#999',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}},'사유 (필수)'),
          h('div',{style:{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}},
            ['시스템 장애로 스캔 불가 — 육안 확인 후 출고','레이블 파싱 오류 — 육안 확인 후 출고','기타'].map(r=>h('button',{key:r,onClick:()=>setTtBulkConfirm(c=>({...c,reason:r})),style:{padding:'5px 10px',borderRadius:100,border:'1px solid #DDD',background:ttBulkConfirm.reason===r?'#FFF0DC':'#fff',color:'#7A3A00',fontSize:11,cursor:'pointer'}},r))
          ),
          h('textarea',{value:ttBulkConfirm.reason,onChange:e=>setTtBulkConfirm(c=>({...c,reason:e.target.value})),placeholder:'구체적인 사유를 입력하세요…',style:{width:'100%',minHeight:60,padding:10,border:'1.5px solid #DDD',borderRadius:8,fontSize:13,fontFamily:'inherit',resize:'vertical',marginBottom:20,outline:'none'}}),
          h('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
            h('button',{onClick:()=>setTtBulkConfirm(null),disabled:ttBulkRunning,style:{padding:'9px 18px',borderRadius:8,border:'1px solid #DDD',background:'#F5F5F5',cursor:ttBulkRunning?'not-allowed':'pointer',fontWeight:600}},'Cancel'),
            h('button',{onClick:ttBulkForceComplete,disabled:!ttBulkConfirm.reason.trim()||ttBulkRunning,style:{padding:'9px 22px',borderRadius:8,border:'none',background:(ttBulkConfirm.reason.trim()&&!ttBulkRunning)?'#D97706':'#CCC',color:'#fff',cursor:(ttBulkConfirm.reason.trim()&&!ttBulkRunning)?'pointer':'not-allowed',fontWeight:700}},ttBulkRunning?('처리 중… ('+(ttBulkProgress?ttBulkProgress.done:0)+'/'+(ttBulkProgress?ttBulkProgress.total:ttBulkConfirm.rows.length)+')'):('⚡ '+ttBulkConfirm.rows.length+'건 완료 처리'))
          )
        )
      ),
      (addPickerFor||editAssign)&&h('div',{className:'overlay',onClick:e=>{if(e.target===e.currentTarget){setAddPickerFor(null);setEditAssign(null);}}},
        h('div',{style:{background:'#fff',borderRadius:16,padding:24,minWidth:320,maxWidth:380,boxShadow:'0 8px 32px rgba(0,0,0,0.18)'}},
          h('div',{style:{fontWeight:700,fontSize:16,marginBottom:2}},editAssign?'✎ Edit Picker':'👷 Add Picker'),
          h('div',{style:{fontSize:12,color:'#888',marginBottom:16}},(editAssign?editAssign.pgNo+' · '+editAssign.category:addPickerFor.pgNo+' · '+addPickerFor.category)+' · 총 '+((editAssign?lists.find(x=>x.pgNo===editAssign.pgNo)?.pages:addPickerFor?.pages)||0)+'페이지'),
          h('label',{style:{display:'block',fontSize:11,fontWeight:700,color:'#999',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}},'작업자 선택'),
          h('div',{style:{display:'flex',flexWrap:'wrap',gap:6,marginBottom:16}},
            pickers.map(p=>{const wc=pkC(p);const on=apWorker===p;
              return h('button',{key:p,onClick:()=>setApWorker(p),style:{padding:'7px 13px',borderRadius:100,border:'1.5px solid '+(on?wc.tx:'#DDD'),background:on?wc.bg:'#fff',color:on?wc.tx:'#666',fontWeight:on?700:500,fontSize:12,cursor:'pointer',fontFamily:'inherit'}},p);
            })
          ),
          h('label',{style:{display:'block',fontSize:11,fontWeight:700,color:'#999',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}},'몇 페이지부터 몇 페이지까지'),
          h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:6}},
            // ★ v83: "시작 페이지"가 자동계산된 텍스트로만 보여서 "칸이 하나뿐"인 것처럼
            //   보인다는 피드백 — 시작 페이지도 항상 편집 가능한 입력창으로 만들어서
            //   [시작 칸] ~ [종료 칸] 두 개가 나란히 보이도록 재구성. (기본값은 자동계산되어
            //   채워지므로, 대부분은 그대로 두고 종료 페이지만 입력하면 됨)
            h('input',{type:'number',min:1,value:apStart,onChange:e=>{
              // ★ v84: 시작 페이지를 직접 고치면 종료 페이지도 자동으로 같은 숫자로
              //   맞춰줘서(=기본 1페이지), "1페이지만 가져갈 땐 시작 칸만 고치면 됨"이
              //   실제로 그렇게 동작하도록 함. 여러 페이지를 원하면 종료 칸을 따로 넓히면 됨.
              const v=e.target.value;setApStart(v);setApEnd(v);
            },style:{width:64,textAlign:'center',fontSize:18,fontWeight:700,padding:'8px 4px',border:'1.5px solid #5B5EF4',borderRadius:8,outline:'none',background:'#F0EEFF',color:'#5B5EF4'}}),
            h('span',{style:{fontSize:16,fontWeight:700,color:'#AAA'}},'~'),
            h('input',{type:'number',min:+apStart||1,max:(editAssign?lists.find(x=>x.pgNo===editAssign.pgNo)?.pages:addPickerFor?.pages)||undefined,value:apEnd,onChange:e=>{
              // ★ v75: 총 페이지 수를 넘는 값은 입력 즉시 총 페이지로 잘라냄
              const totalP=(editAssign?lists.find(x=>x.pgNo===editAssign.pgNo)?.pages:addPickerFor?.pages)||0;
              const v=e.target.value;
              setApEnd(totalP>0&&+v>totalP?String(totalP):v);
            },style:{width:64,textAlign:'center',fontSize:18,fontWeight:700,padding:'8px 4px',border:'1.5px solid #DDD',borderRadius:8,outline:'none'}}),
            h('span',{style:{fontSize:12,color:'#888'}},'페이지')
          ),
          h('div',{style:{fontSize:11,color:'#AAA',marginBottom:16}},'시작 페이지는 이전 작업자들이 가져간 다음 페이지로 자동 채워집니다 — 필요하면 직접 수정 가능'),
          (()=>{
            const s=+apStart||1;const e=Math.max(s,+apEnd||s);
            const pgNo=editAssign?editAssign.pgNo:addPickerFor?.pgNo;
            const ov=pgNo?findOverlap(pgNo,s,e,editAssign?.id):null;
            return h('div',{style:{marginBottom:20}},
              h('div',{style:{fontSize:13,fontWeight:700,color:ov?'#DC2626':'#5B5EF4'}},'→ '+s+'~'+e+' 페이지 배정 (총 '+(e-s+1)+'페이지)'),
              // ★ v85: 겹치는 배정이 있으면 입력하는 순간 바로 경고 문구 표시 (제출 전에 미리 인지)
              ov&&h('div',{style:{fontSize:12,fontWeight:600,color:'#DC2626',marginTop:6}},'⚠ '+ov.pageStart+'~'+ov.pageEnd+'페이지는 이미 '+ov.worker+'님에게 배정되어 있습니다. 겹치지 않게 다시 입력해주세요.')
            );
          })(),
          h('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
            h('button',{onClick:()=>{setAddPickerFor(null);setEditAssign(null);},disabled:apSubmitting,style:{padding:'9px 18px',borderRadius:8,border:'1px solid #DDD',background:'#F5F5F5',cursor:apSubmitting?'not-allowed':'pointer',fontWeight:600,opacity:apSubmitting?0.5:1}},'Cancel'),
            (()=>{
              const s=+apStart||1;const e=Math.max(s,+apEnd||s);
              const pgNo=editAssign?editAssign.pgNo:addPickerFor?.pgNo;
              const ov=pgNo?findOverlap(pgNo,s,e,editAssign?.id):null;
              const ok=apWorker&&+apEnd>0&&+apEnd>=(+apStart||1)&&!ov;
              // ★ v152 버그 수정: 클릭 후 서버 응답(await)이 올 때까지 버튼이 그대로라
              //   "눌렸는지 안 눌렸는지 모르겠다"며 중복 클릭하던 문제 — 제출 중에는
              //   버튼을 비활성화하고 스피너+"처리 중…" 텍스트로 명확히 표시한다.
              const disabled=!ok||apSubmitting;
              return h('button',{onClick:editAssign?submitEditAssign:submitAddPicker,disabled,style:{padding:'9px 22px',borderRadius:8,border:'none',background:disabled?'#CCC':'#5B5EF4',color:'#fff',cursor:disabled?'not-allowed':'pointer',fontWeight:700,display:'inline-flex',alignItems:'center',gap:8}},
                apSubmitting&&h('span',{style:{display:'inline-block',width:14,height:14,border:'2px solid rgba(255,255,255,0.4)',borderTopColor:'#fff',borderRadius:'50%',animation:'tt-spin 0.7s linear infinite'}}),
                apSubmitting?'처리 중…':(editAssign?'저장':'▶ Start Picking')
              );
            })()
          )
        )
      ),
      // ★ v86: 지연사유 선택 팝업 텍스트 영어로 변경 (요청사항)
      endPickIssueModal&&h('div',{className:'overlay',onClick:e=>{if(e.target===e.currentTarget)setEndPickIssueModal(null);}},
        h('div',{style:{background:'#fff',borderRadius:16,padding:24,minWidth:320,maxWidth:380,boxShadow:'0 8px 32px rgba(0,0,0,0.18)'}},
          h('div',{style:{fontWeight:700,fontSize:16,marginBottom:2}},'✅ Picking Complete — '+endPickIssueModal.worker),
          h('div',{style:{fontSize:12,color:'#888',marginBottom:18}},endPickIssueModal.pgNo+' · Pages '+endPickIssueModal.pageStart+'~'+endPickIssueModal.pageEnd),
          h('div',{style:{fontSize:12,color:'#999',marginBottom:10,fontWeight:600}},'Any delays or issues? (Optional — leave blank and Complete if none)'),
          h('label',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,border:'1.5px solid '+(epForklift?'#5B5EF4':'#DDD'),background:epForklift?'#F0EEFF':'#fff',marginBottom:8,cursor:'pointer'}},
            h('input',{type:'checkbox',checked:epForklift,onChange:e=>setEpForklift(e.target.checked),style:{width:16,height:16}}),
            h('span',{style:{fontSize:13,fontWeight:600,color:'#333'}},'🚜 Forklift in use')
          ),
          h('label',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,border:'1.5px solid '+(epOther?'#5B5EF4':'#DDD'),background:epOther?'#F0EEFF':'#fff',marginBottom:epOther?8:18,cursor:'pointer'}},
            h('input',{type:'checkbox',checked:epOther,onChange:e=>setEpOther(e.target.checked),style:{width:16,height:16}}),
            h('span',{style:{fontSize:13,fontWeight:600,color:'#333'}},'✏️ Other')
          ),
          epOther&&h('input',{type:'text',value:epOtherText,onChange:e=>setEpOtherText(e.target.value),placeholder:'Please describe the issue…',style:{width:'100%',padding:'9px 12px',border:'1.5px solid #DDD',borderRadius:8,fontSize:13,fontFamily:'inherit',outline:'none',marginBottom:18,boxSizing:'border-box'}}),
          h('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
            h('button',{onClick:()=>setEndPickIssueModal(null),style:{padding:'9px 18px',borderRadius:8,border:'1px solid #DDD',background:'#F5F5F5',cursor:'pointer',fontWeight:600}},'Cancel'),
            h('button',{onClick:submitEndPickIssue,style:{padding:'9px 22px',borderRadius:8,border:'none',background:'#16A34A',color:'#fff',cursor:'pointer',fontWeight:700}},'✓ Complete')
          )
        )
      )
    );
  }catch(renderErr){
    console.error('Render error:',renderErr);
    return h('div',{style:{padding:'30px',fontFamily:'monospace',color:'#c00',background:'#fff'}},
      h('h2',null,'Render Error'),h('pre',null,renderErr.message),
      h('button',{onClick:()=>{setEL(null);setTab('records');},style:{marginTop:'10px',padding:'8px 16px',cursor:'pointer'}},'Reset to Records')
    );
  }
}

try{
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
}catch(err){
  document.getElementById('root').innerHTML='<div style="padding:40px;font-family:sans-serif;color:#c00"><h2>Error</h2><pre>'+err.message+'</pre></div>';
  console.error(err);
}
</script>
</body>
</html>
