const dur=(s,e,listDate)=>{
  if(!s)return'—';
  const parseTime=(val,baseDate)=>{
    if(!val)return null;const str=String(val).trim();
    if(/^\d{1,2}:\d{2}(:\d{2})?$/.test(str)){const base=baseDate||today();return new Date(base+' '+str);}
    if(/^\d{4}-\d{2}-\d{2}/.test(str))return new Date(str);
    const d=new Date(val);if(!isNaN(d)){if(d.getFullYear()<1970){const base=baseDate||today();const hh=String(d.getHours()).padStart(2,'0');const mm=String(d.getMinutes()).padStart(2,'0');const ss=String(d.getSeconds()).padStart(2,'0');return new Date(base+' '+hh+':'+mm+':'+ss);}return d;}return null;
  };
  const base=listDate||today();const start=parseTime(s,base);const end=e?parseTime(e,base):new Date();
  if(!start||isNaN(start)||!end||isNaN(end)||end<=start)return'—';
  const WS=8*60+30,LS=12*60,LE=13*60,WE=17*60+30;
  const toM=d=>d.getHours()*60+d.getMinutes();
  const dayWork=(sm,em)=>{sm=Math.max(sm,WS);em=Math.min(em,WE);if(em<=sm)return 0;let m=0;if(sm<LS)m+=Math.min(em,LS)-sm;if(em>LE)m+=em-Math.max(sm,LE);return Math.max(0,m);};
  let total=0,cur=new Date(start),guard=0;
  while(cur<end&&guard++<400){const y=cur.getFullYear(),mo=cur.getMonth(),d=cur.getDate();const nextDay=new Date(y,mo,d+1,8,30,0);const sm=toM(cur);const em=cur.toDateString()===end.toDateString()?toM(end):WE;total+=dayWork(sm,Math.min(em,WE));cur=nextDay;if(cur>=end)break;}
  if(total<=0)return'—';return total<60?total+'m':Math.floor(total/60)+'h '+(total%60)+'m';
};

/* ══════════════════════════════════════════════
   ★ v19 CORE FIX: mergeRemoteIntoLocal
   - 절대 로컬 pgNo/id를 덮어쓰지 않음
   - id 매칭 → pgNo+date 매칭 순서로 찾음
   - 매칭된 항목은 로컬 pgNo/id 유지, 데이터만 업데이트
   - 매칭 안 된 remote 항목만 새로 추가 (단, 오늘 날짜만)
   - dedupeByCategory 완전 제거 (이것이 Official 1 삭제 원인이었음)
══════════════════════════════════════════════ */
const mergeRemoteIntoLocal=(prev,fetchedList,targetDate)=>{
  const merged=[...prev];
  const nd=d=>{if(!d)return'';if(d instanceof Date){try{return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch(e){}}return String(d).slice(0,10);};
  const rankSt=s=>{const r={'pending':0,'picking':1,'pick done':2,'scanning':3,'complete':4};return r[(s||'').toLowerCase()]??-1;};

  fetchedList.forEach(remote=>{
    // Deleted 상태는 무시
    if((remote.status||'').toLowerCase()==='deleted') return;
    const rDate=nd(remote.date);

    // ── 매칭 탐색 (id → pgNo+date 순서) ──
    let idx=-1;
    // 1) id로 찾기 (remote.id가 있고 로컬에 같은 id 있으면)
    if(remote.id){
      idx=merged.findIndex(l=>l.id&&l.id===remote.id&&(l.status||'').toLowerCase()!=='deleted');
    }
    // 2) pgNo+date로 찾기
    if(idx<0&&remote.pgNo&&rDate){
      idx=merged.findIndex(l=>l.pgNo===remote.pgNo&&nd(l.date)===rDate&&(l.status||'').toLowerCase()!=='deleted');
    }

    if(idx>=0){
      // ── 기존 항목 업데이트: 로컬 pgNo/id는 절대 변경하지 않음 ──
      const loc=merged[idx];
      const locRank=rankSt(getSt(loc));
      const remRank=rankSt(remote.status);

      // scanned는 더 큰 값 유지
      const newScanned=Math.max(loc.scanned||0, remote.scanned||0);
      // worker는 로컬 우선 (로컬에 값 있으면 유지)
      const newWorker=loc.worker||remote.worker||'';
      // 시간값: 로컬 우선 (로컬에 값 있으면 유지)
      const newPickStart=loc.pickStart||remote.pickStart||'';
      const newPickEnd=loc.pickEnd||remote.pickEnd||'';
      const newScanStart=loc.scanStart||remote.scanStart||'';
      const newScanEnd=loc.scanEnd||remote.scanEnd||'';

      merged[idx]={
        ...loc,                    // ★ 로컬 데이터 기반 (pgNo, id 등 로컬 유지)
        orderCount:remote.orderCount||loc.orderCount||0,
        sku:remote.sku||loc.sku||0,
        scanned:newScanned,
        worker:newWorker,
        pickStart:newPickStart,
        pickEnd:newPickEnd,
        scanStart:newScanStart,
        scanEnd:newScanEnd,
        memo:loc.memo||remote.memo||'',
        skipReason:loc.skipReason||remote.skipReason||'',
      };
    } else {
      // ── 새 항목: remote에서 추가 (오늘 날짜만, 과거 날짜 추가 안 함) ──
      if(rDate===targetDate){
        merged.push({
          id:remote.id||('gs_'+remote.pgNo+'_'+rDate),
          date:rDate,
          pgNo:remote.pgNo,
          category:remote.category,
          sku:remote.sku||0,
          orderCount:remote.orderCount||0,
          scanned:remote.scanned||0,
          worker:remote.worker||'',
          pickStart:remote.pickStart||'',
          pickEnd:remote.pickEnd||'',
          scanStart:remote.scanStart||'',
          scanEnd:remote.scanEnd||'',
          status:remote.status||'Pending',
          memo:remote.memo||'',
          skipReason:remote.skipReason||'',
        });
      }
    }
  });

  return merged;
};

     - ver 변경 시에만 pull
     - mergeRemoteIntoLocal 사용 (dedup 없음)
     - 삭제된 항목 복원 방지
  ══════════════════════════ */
  const lastVerRef=useRef('');
  useEffect(()=>{
    if(!wh)return;
    const poll=async()=>{
      try{
        const res=await fetch(wh+'?op=ver');
        const data=await res.json();
        if(!data.ok)return;
        const newVer=String(data.ver||'');
        if(lastVerRef.current&&newVer!==lastVerRef.current){
          // 버전 변경 → 오늘 데이터 pull
          const r2=await fetch(wh+'?op=getLists&date='+today());
          const d2=await r2.json();
          if(d2.ok&&d2.lists){
            // 삭제된 항목 필터링
            const fetched=d2.lists.filter(l=>{
              if((l.status||'').toLowerCase()==='deleted')return false;
              // 로컬에서 삭제 처리된 항목은 복원하지 않음
              const dStr=String(l.date||'').slice(0,10);
              if(deletedKeys.current.has(l.pgNo+'_'+dStr))return false;
              return true;
            });
            if(fetched.length>0){
              setLists(prev=>{
                const merged=mergeRemoteIntoLocal(prev,fetched,today());
                lsSet(LS.LISTS,merged);
                return merged;
              });
              setSS('↻ '+new Date().toLocaleTimeString());
            }
          }
        }
        lastVerRef.current=newVer;
      }catch(e){console.warn('poll error',e);}
    };
    poll();
    const id=setInterval(poll,30000);
    return()=>clearInterval(id);
  },[wh]);

  const sync=useCallback((action,payload)=>{
    if(!wh)return;
    syncData(wh,action,payload).then(()=>setSS('✓ '+new Date().toLocaleTimeString())).catch(()=>setSS('⚠'));
  },[wh]);

  /* mutations */
  const upd=(id,ch)=>setLists(p=>p.map(l=>{if(l.id!==id)return l;const u={...l,...ch};sync('upsertList',{list:u});return u;}));
  const setWrk=(id,n)=>upd(id,{worker:n});
  const startPick=id=>{
    const l=lists.find(x=>x.id===id);if(!l)return;
    if(!l.worker){alert('Please assign a picker first before starting.');return;}
    if(!l.pickStart)upd(id,{pickStart:ts()});
  };
  const endPick=id=>{const l=lists.find(x=>x.id===id);if(l&&l.pickStart&&!l.pickEnd)upd(id,{pickEnd:ts()});};
  const startScan=id=>{const l=lists.find(x=>x.id===id);if(l&&!l.scanStart)upd(id,{scanStart:ts()});};
  const endScan=id=>{
    const l=lists.find(x=>x.id===id);
    if(!l||!l.pickEnd||l.scanEnd)return;
    const oc=l.orderCount||0;const missed=oc-l.scanned;
    if(missed<=0){if(!window.confirm('⏹ End Scan — '+l.pgNo+'\nAll '+oc+' scanned. End scan?'))return;upd(id,{scanEnd:ts()});return;}
    setScanInput(l.scanned||0);
    setSkipQtys({OOS:0,'NF (Not Found)':0,'EXP (Expiry Issue)':0,'Customer Cancel':0});
    setEndScanModal({id,pgNo:l.pgNo,scanned:l.scanned,oc,missed});
  };
  const addN=(id,q)=>setLists(prev=>prev.map(l=>{
    if(l.id!==id)return l;const now=ts();const oc=l.orderCount||0;const nc=(l.scanned||0)+q;
    const ch={scanned:nc};if(!l.scanStart)ch.scanStart=now;if(nc>=oc&&oc>0&&!l.scanEnd)ch.scanEnd=now;
    const u={...l,...ch};sync('upsertList',{list:u});return u;
  }));

  /* scan barcode */
  const handleScan=e=>{
    if(e.key!=='Enter')return;const b=scanIn.trim();if(!b)return;setSI('');
    const d=detect(b);if(!d){setSE('Unrecognized: '+b);setLS(null);return;}
    setSE('');const now=ts();const td=today();
    const tgt=lists.find(l=>l.category===d.cat&&l.date===td&&l.scanned<(l.orderCount||0));
    if(!tgt){setSE(d.cat+' — No active pick list');setLS({barcode:b,cat:d.cat,store:d.store,time:fmtT(now),ok:false});return;}
    setLists(prev=>prev.map(l=>{
      if(l.id!==tgt.id)return l;const nc=l.scanned+1;const oc=l.orderCount||0;const ch={scanned:nc};
      if(!l.scanStart)ch.scanStart=now;if(nc>=oc&&oc>0&&!l.scanEnd)ch.scanEnd=now;
      const u={...l,...ch};sync('upsertList',{list:u});return u;
    }));
    const entry={barcode:b,cat:d.cat,store:d.store,time:fmtT(now),pgNo:tgt.pgNo,worker:tgt.worker||''};
    setLS({...entry,ok:true});setLog(prev=>[entry,...prev.slice(0,499)]);sync('addScanLog',{entry});
  };

  /* manager: save pick list */
  const mSave=()=>{
    if(!mf.pgNo||!mf.orders)return;
    const existing=editId?lists.find(x=>x.id===editId):null;
    if(!editId){
      // ★ 중복 체크: pgNo 전체 (Deleted 제외)
      const dupPgNo=lists.find(x=>x.pgNo===mf.pgNo&&(x.status||'').toLowerCase()!=='deleted');
      if(dupPgNo){alert('이미 동일한 PG No가 있습니다: '+mf.pgNo+' ('+dupPgNo.date+', '+dupPgNo.category+')\n수정하려면 Edit 버튼을 사용하세요.');return;}
      // ★ 같은 category+today 중복 체크 (Deleted 제외)
      const dupCat=lists.find(x=>x.category===mf.cat&&String(x.date||'').slice(0,10)===today()&&(x.status||'').toLowerCase()!=='deleted');
      if(dupCat){alert('오늘 이미 같은 카테고리 픽리스트가 있습니다: '+mf.cat+' ('+dupCat.pgNo+')\n수정하려면 Edit 버튼을 사용하세요.');return;}
    }
    // ★ id는 pgNo_date 고정 (GAS와 동일, 랜덤 uid 사용하지 않음)
    const listDate=existing?.date||today();
    const newId=mf.pgNo+'_'+listDate;
    const nl={
      id:editId?existing.id:newId,
      pgNo:mf.pgNo,category:mf.cat,sku:+mf.sku||0,orderCount:+mf.orders,
      scanned:existing?.scanned||0,pickStart:existing?.pickStart||null,pickEnd:existing?.pickEnd||null,
      scanStart:existing?.scanStart||null,scanEnd:existing?.scanEnd||null,worker:existing?.worker||'',
      date:listDate,memo:mf.memo||''
    };
    setLists(p=>editId?p.map(x=>x.id===editId?nl:x):[...p,nl]);
    sync('upsertList',{list:nl});
    setMF({pgNo:'',cat:cat!=='All'?cat:'Official 1',sku:'',orders:'',memo:''});
    setEId(null);setTab('records');
  };

  /* edit save / delete */
  const editSave=updated=>{
    setLists(p=>p.map(l=>{
      if(l.id===updated.id)return updated;
      if(l.pgNo===updated.pgNo&&l.date===updated.date)return{...updated,id:l.id};
      return l;
    }));
    sync('upsertList',{list:updated});
    setEL(null);
  };
  const delItem=id=>{
    const l=lists.find(x=>x.id===id);
    if(l){deletedKeys.current.add(l.pgNo+'_'+String(l.date||'').slice(0,10));sync('deleteList',{pgNo:l.pgNo,date:l.date});}
    setLists(p=>p.filter(x=>x.id!==id));
    setEL(null);
  };
  const delFromTable=id=>{
    if(!window.confirm('Delete this pick list?'))return;
    const l=lists.find(x=>x.id===id);
    if(l){deletedKeys.current.add(l.pgNo+'_'+String(l.date||'').slice(0,10));sync('deleteList',{pgNo:l.pgNo,date:l.date});}
    setLists(p=>p.filter(x=>x.id!==id));
  };

  /* Sync from Sheets (manual pull) */
  const syncFromSheets=async()=>{
    if(!wh){setSyncMsg('⚠ GAS URL이 설정되지 않았습니다.');return;}
    setSyncMsg('⏳ Google Sheets에서 데이터 가져오는 중...');
    try{
      const res=await fetch(wh+'?op=getLists&date=',{method:'GET'});
      const data=await res.json();
      if(!data.ok){setSyncMsg('⚠ 데이터 가져오기 실패: '+(data.error||'unknown'));return;}
      const fetched=(data.lists||[]).filter(l=>{
        if((l.status||'').toLowerCase()==='deleted')return false;
        const dStr=String(l.date||'').slice(0,10);
        if(deletedKeys.current.has(l.pgNo+'_'+dStr))return false;
        return true;
      });
      if(fetched.length===0){setSyncMsg('⚠ Google Sheets에 데이터가 없습니다.');return;}
      setLists(prev=>{
        const merged=mergeRemoteIntoLocal(prev,fetched,'');  // 전체 날짜
        lsSet(LS.LISTS,merged);
        return merged;
      });
      setSyncMsg('✓ '+fetched.length+'개 항목을 Google Sheets에서 동기화했습니다. ('+new Date().toLocaleTimeString()+')');
    }catch(e){setSyncMsg('⚠ 오류: '+e.message);}
  };

  const delCompleted=()=>{
    const completed=lists.filter(l=>l.date===today()&&getSt(l)==='complete');
    if(!completed.length){alert('No completed lists today.');return;}
    if(!window.confirm('Delete '+completed.length+' completed list(s) from today?\n\nData remains in Google Sheets.'))return;
    completed.forEach(l=>deletedKeys.current.add(l.pgNo+'_'+String(l.date||'').slice(0,10)));
    setLists(p=>p.filter(l=>!(l.date===today()&&getSt(l)==='complete')));
    completed.forEach(l=>sync('deleteList',{pgNo:l.pgNo,date:l.date}));
  };
  const delAllToday=()=>{
    const todays=lists.filter(l=>l.date===today());
    if(!todays.length){alert('No lists for today.');return;}
    if(!window.confirm('Delete ALL '+todays.length+' list(s) from today?\n\nData remains in Google Sheets.'))return;
    todays.forEach(l=>deletedKeys.current.add(l.pgNo+'_'+String(l.date||'').slice(0,10)));
    setLists(p=>p.filter(l=>l.date!==today()));
    todays.forEach(l=>sync('deleteList',{pgNo:l.pgNo,date:l.date}));
  };

  /* ShipStation */
  const fetchSSOrders=async()=>{
    if(!wh){setSSM('⚠ Please set Google Sheets URL first');return;}
    if(!ssKey||!ssSecret){setSSM('⚠ Please enter ShipStation API Key and Secret');return;}
    setSSF(true);setSSM('');setSSR(null);
    try{
      const r=await fetch(wh,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'fetchSSOrders',apiKey:ssKey,apiSecret:ssSecret,date:today()})});
      const data=await r.json();
      if(!data.ok){setSSM('⚠ '+data.error);setSSF(false);return;}
      setSSR(data);setSSM('✓ Fetched '+data.totalOrders+' orders from ShipStation');
    }catch(e){setSSM('⚠ '+e.message);}
    setSSF(false);
  };
  const testSSConn=async()=>{
    if(!wh||!ssKey||!ssSecret){setSSM('⚠ Fill in URL, API Key and Secret first');return;}
    setSSF(true);setSSM('Testing…');
    try{
      const r=await fetch(wh,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'testSSConnection',apiKey:ssKey,apiSecret:ssSecret})});
      const data=await r.json();setSSM(data.ok?'✓ Connected! '+data.storeCount+' stores found':'⚠ '+data.error);
    }catch(e){setSSM('⚠ '+e.message);}
    setSSF(false);
  };

  const changePin=()=>{if(np1.length!==4||!/^\d{4}$/.test(np1)){setPM('Must be 4 digits');return;}if(np1!==np2){setPM('PINs do not match');return;}lsSet(LS.PIN,np1);setNP1('');setNP2('');setPM('✓ PIN changed');};
  const exportCSV=()=>{const h2=['Date','PG No','Category','SKU','Orders','Scanned','Worker','Pick Start','Pick End','Scan Start','Scan End','Pick Dur','Scan Dur','Status','Remarks'];const rows=lists.map(l=>[l.date,l.pgNo,l.category,l.sku||0,l.orderCount,l.scanned,l.worker||'',fmtT(l.pickStart),fmtT(l.pickEnd),fmtT(l.scanStart),fmtT(l.scanEnd),dur(l.pickStart,l.pickEnd,l.date),dur(l.scanStart,l.scanEnd,l.date),getSt(l),l.memo||'']);const csv=[h2,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='B2C_'+today()+'.csv';a.click();};

  /* SS Modal */
  const openSSModal=()=>{
    if(!ssResult||!ssResult.summary)return;
    const rows=ssResult.summary.filter(s=>s.orderCount&&s.category!=='Unknown'&&s.category!=='TikTok CBT').map(s=>({category:s.category,orderCount:s.orderCount,storeList:s.storeList,pgNo:'',sku:'',memo:''}));
    if(ttCbtCount>0)rows.push({category:'TikTok CBT',orderCount:ttCbtCount,storeList:'TikTok: '+ttCbtCount,pgNo:'',sku:'',memo:''});
    setSSModalData(rows);setSSModal(true);
  };
  const confirmCreateLists=()=>{
    const modalWithTT=[...ssModalData.filter(s=>s.category!=='TikTok CBT')];
    if(ttCbtCount>0)modalWithTT.push({category:'TikTok CBT',orderCount:ttCbtCount,sku:0,storeList:'TikTok: '+ttCbtCount});
    const createdCats=new Set();const newLists=[];
    modalWithTT.forEach(s=>{
      if(!s.orderCount)return;if(createdCats.has(s.category))return;createdCats.add(s.category);
      const listDate=today();
      const existing=lists.find(l=>l.category===s.category&&String(l.date||'').slice(0,10)===listDate&&(l.status||'').toLowerCase()!=='deleted');
      const pgNo=s.pgNo||existing?.pgNo||('PG'+uid().slice(-8));
      if(existing){
        upd(existing.id,{orderCount:s.orderCount,sku:+s.sku||0,memo:s.memo||existing.memo||''});
      }else{
        // ★ id = pgNo_date 고정
        const id=pgNo+'_'+listDate;
        const nl={id,pgNo,category:s.category,sku:+s.sku||0,orderCount:s.orderCount,scanned:0,pickStart:null,pickEnd:null,scanStart:null,scanEnd:null,worker:'',date:listDate,memo:s.memo||''};
        newLists.push(nl);
      }
    });
    if(newLists.length>0){
      setLists(p=>{
        const merged=[...p,...newLists.filter(nl=>!p.find(x=>x.id===nl.id))];
        lsSet(LS.LISTS,merged);
        return merged;
      });
      newLists.forEach(nl=>sync('upsertList',{list:nl}));
    }
    setSSM('✓ Pick lists created/updated!');setSSModal(false);setTab('records');
  };

  /* derived */
  const todayL=lists.filter(l=>l.date===today());
  const prevIncomplete=lists.filter(l=>l.date!==today()&&!['complete'].includes(getSt(l)));
  const displayL=showPrev?[...prevIncomplete,...todayL]:todayL;
  const filtL=cat==='All'?displayL:displayL.filter(l=>l.category===cat);
  const tSKU=todayL.reduce((a,l)=>a+(l.sku||0),0);
  const tOrd=todayL.reduce((a,l)=>a+(l.orderCount||0),0);
  const tScan=todayL.reduce((a,l)=>a+l.scanned,0);
  const tDone=todayL.filter(l=>getSt(l)==='complete').length;
  const doneSKU=todayL.filter(l=>getSt(l)==='complete').reduce((a,l)=>a+(l.sku||0),0);
  const actWk=[...new Set(todayL.filter(l=>getSt(l)!=='pending'&&l.worker).map(l=>l.worker))];
  const skuPct=tSKU>0?Math.round((doneSKU/tSKU)*100):0;
  const ordPct=tOrd>0?Math.round((tScan/tOrd)*100):0;
  const jobPct=todayL.length>0?Math.round((tDone/todayL.length)*100):0;
  const D=isMgr?'dark':'light';

  /* Stats Bar */
  const SB=()=>h('div',{className:'stats-bar '+D},
    [{lbl:'Total SKU',big:doneSKU,sub:'/'+tSKU,pct:skuPct,clr:'#6366F1'},
     {lbl:'Total Orders',big:tScan,sub:'/'+tOrd,pct:ordPct,clr:'#10B981'},
     {lbl:'Scan Progress',big:tScan,sub:'/'+tOrd,pct:ordPct,clr:'#F59E0B'},
     {lbl:'Jobs Complete',big:tDone,sub:'/'+todayL.length,pct:jobPct,clr:'#EC4899'},
    ].map((c,i)=>h('div',{key:i,className:'stat '+D},
      h('div',{className:'stat-accent',style:{background:c.clr}}),
      h('div',{className:'stat-lbl '+D},c.lbl),
      h('div',{className:'stat-row'},
        h('div',{style:{display:'flex',alignItems:'baseline',gap:4}},
          h('span',{className:'stat-num '+D,style:{color:isMgr?c.clr:'#111'}},c.big),
          h('span',{className:'stat-sub '+D},c.sub)

      h('div',{className:'stat-bar '+D},h('div',{className:'stat-fill',style:{width:c.pct+'%',background:c.clr}}))
    )).concat([

        h('div',{className:'stat-accent',style:{background:'#3B82F6'}}),
        h('div',{className:'stat-lbl '+D},'Active Pickers'),
        h('div',{className:'stat-row'},
          h('div',{style:{display:'flex',alignItems:'baseline',gap:4}},
            h('span',{className:'stat-num '+D,style:{color:isMgr?'#3B82F6':'#111'}},actWk.length),
            h('span',{className:'stat-sub '+D},actWk.length?'pickers':'—')
          )
        ),
        h('div',{style:{marginTop:8,display:'flex',flexWrap:'wrap',gap:5}},
          actWk.length===0
            ?h('span',{style:{fontSize:12,color:isMgr?'#4848A0':'#CCC',fontStyle:'italic'}},'No active pickers')
            :actWk.map(w=>{const c=pkC(w);return h('span',{key:w,style:{display:'inline-flex',alignItems:'center',gap:4,background:isMgr?'rgba(255,255,255,0.07)':c.bg,border:'1px solid '+(isMgr?'rgba(255,255,255,0.14)':c.br||c.bg),borderRadius:100,padding:'3px 9px 3px 7px',fontSize:11,fontWeight:600,color:isMgr?'#D0D0F0':c.tx}},h('span',{style:{width:7,height:7,borderRadius:'50%',flexShrink:0,background:c.tx}}),w);})

  /* Category Tabs */
  const CTabs=({actions})=>{
    const counts=Object.fromEntries(['All',...CATS].map(c=>[c,c==='All'?todayL.length:todayL.filter(l=>l.category===c).length]));

        h('tbody',null,
          filtL.map((l,i)=>{

            const isPrev=l.date!==today();

              h('td',{className:D},h('span',{className:'mono',style:{fontWeight:700,color:isMgr?'#C4C2FF':'#111',fontSize:14}},l.pgNo)),

              h('td',{className:D+' c',style:{fontWeight:600,color:isMgr?'#CCC':'#333'}},l.sku||0),
